name: Cardoria Live Audit Browser
on:
  push:
    branches: [feature/live-shipping-final]
    paths: ['js/**', 'css/**', 'backend/**', 'tests/live-audit-browser.mjs', 'tests/live-postal-address-browser.mjs', '.github/workflows/live-audit-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - name: Install the existing project browser test version
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify computed giveaway button visibility and safe tracking DOM
        run: node tests/live-audit-browser.mjs
      - name: Recheck the existing address and relay browser scenarios
        run: node tests/live-postal-address-browser.mjs
