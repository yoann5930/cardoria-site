name: Cleanup Live Tests Once
on:
  push:
    branches: [ops/cleanup-live-tests-20260916]
    paths: ['.github/workflows/cleanup-live-tests-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add one-time cleanup migration
        shell: bash
        run: |
          set -euo pipefail
          cat > backend/lib/live/cleanup-tests.js <<'EOF'
          import { readJson, writeJson } from "../storage.js";

          const MARKER_KEY = "live-test-cleanup-20260916.json";
          const SESSION_KEY = "live-sessions.json";
          const ACTION_KEY = "live-actions.json";
          const ARCHIVE_KEY = "live-archives.json";

          export function cleanupLegacyLiveTestsOnce() {
            const marker = readJson(MARKER_KEY, { done: false });
            if (marker?.done) return { ...marker, skipped: true };
            const store = readJson(SESSION_KEY, { sessions: [], checkouts: [], adminAccess: [] });
            const sessions = Array.isArray(store.sessions) ? store.sessions : [];
            const removable = sessions.filter((s) => String(s?.ownerRole || "") === "admin" && String(s?.ownerId || "") === "cardoria" && String(s?.title || "").trim() === "Live Cardoria" && ["ended", "cancelled"].includes(String(s?.status || "").toLowerCase()));
            const ids = new Set(removable.map((s) => String(s.id)));
            if (ids.size) {
              store.sessions = sessions.filter((s) => !ids.has(String(s.id)));
              store.checkouts = (Array.isArray(store.checkouts) ? store.checkouts : []).filter((c) => !ids.has(String(c.liveId)));
              store.adminAccess = (Array.isArray(store.adminAccess) ? store.adminAccess : []).filter((g) => !ids.has(String(g.liveId)));
              writeJson(SESSION_KEY, store);
              const actions = readJson(ACTION_KEY, { states: {} });
              if (actions?.states && typeof actions.states === "object") { for (const id of ids) delete actions.states[id]; writeJson(ACTION_KEY, actions); }
              const archives = readJson(ARCHIVE_KEY, { archives: [] });
              if (Array.isArray(archives?.archives)) { archives.archives = archives.archives.filter((a) => !ids.has(String(a.liveId))); writeJson(ARCHIVE_KEY, archives); }
            }
            const result = { done: true, removed: ids.size, removedLiveIds: [...ids], cleanedAt: new Date().toISOString() };
            writeJson(MARKER_KEY, result);
            return result;
          }
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/server.js'); s=p.read_text()
          imp='import { cleanupLegacyLiveTestsOnce } from "./lib/live/cleanup-tests.js";\n'
          if imp not in s:
              anchor='import { scheduleAutoBackup } from "./lib/backup/full.js";\n'
              if anchor not in s: raise SystemExit('server import anchor missing')
              s=s.replace(anchor, anchor+imp, 1)
          call='const liveTestCleanup = cleanupLegacyLiveTestsOnce();\n'
          if call not in s:
              anchor='const app = express();\n'
              if anchor not in s: raise SystemExit('server app anchor missing')
              s=s.replace(anchor, call+anchor, 1)
          p.write_text(s)
          PY
          cat > tests/live-test-cleanup.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "fs";
          test("cleanup targets only ended/cancelled default Cardoria test lives",()=>{
            const src=fs.readFileSync("backend/lib/live/cleanup-tests.js","utf8");
            assert.match(src,/Live Cardoria/);assert.match(src,/ended/);assert.match(src,/cancelled/);assert.match(src,/store\.checkouts/);assert.match(src,/store\.adminAccess/);assert.match(src,/live-actions\.json/);assert.match(src,/live-archives\.json/);
          });
          EOF
          node --check backend/lib/live/cleanup-tests.js
          node --check backend/server.js
          node --test tests/live-test-cleanup.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/lib/live/cleanup-tests.js backend/server.js tests/live-test-cleanup.test.mjs
          git commit -m 'fix(live): remove legacy test sessions once'
          git push origin HEAD:ops/cleanup-live-tests-20260916
