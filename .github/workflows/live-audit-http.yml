name: Cardoria Live Audit HTTP
on:
  push:
    branches: [feature/live-shipping-final]
    paths: ['backend/**', '.github/workflows/live-audit-http.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-http-scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        scenario: [live-admin-core-e2e, live-seller-core-e2e, live-public-e2e]
    env:
      NODE_ENV: test
      PORT: '10000'
      TEST_BASE_URL: 'http://127.0.0.1:10000'
      CORS_ORIGINS: 'http://127.0.0.1:10000'
      ALERT_EMAIL: 'false'
      ADMIN_REQUIRE_2FA: 'false'
      MARKETPLACE_DEMO_MODE: 'false'
      SENDCLOUD_LIVE_LABELS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --omit=dev
      - name: Start isolated test server
        working-directory: backend
        run: |
          node server.js > /tmp/cardoria-http-audit.log 2>&1 &
          echo $! > /tmp/cardoria-http-audit.pid
      - name: Wait for real local application startup
        run: |
          ready=false
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:10000/api/health/startup | grep -q '"ready":true'; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
      - name: Execute the existing authenticated lifecycle and privacy scenario
        working-directory: backend
        run: node scripts/${{ matrix.scenario }}.mjs
      - name: Stop test server
        if: always()
        run: |
          if [ -f /tmp/cardoria-http-audit.pid ]; then kill "$(cat /tmp/cardoria-http-audit.pid)" || true; fi
          cat /tmp/cardoria-http-audit.log || true
