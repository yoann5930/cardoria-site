name: Cardoria Live Admin Browser E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real browser interaction test
        run: node tests/live-admin-sales-menu-browser.mjs
      - name: Production assets smoke
        shell: bash
        run: |
          set -euo pipefail
          for route in /admin-live.html /js/live-studio-actions-ui.js /js/live-studio-sales-controls.js /css/live-studio-clean.css; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://www.cardoriashop.fr${route}")
            echo "${route} => ${code}"
            case "${code}" in 200|204) ;; *) exit 1 ;; esac
          done
