name: Cardoria Camera 1 Core CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  camera1-core-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: '10000'
      CORS_ORIGINS: 'http://127.0.0.1:10000'
      ALERT_EMAIL: 'false'
      MARKETPLACE_DEMO_MODE: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - name: Install backend
        run: npm install --omit=dev
      - name: Camera 1 syntax checks
        run: |
          node --check routes/live-realtime.js
          node --check scripts/camera1-core-e2e.mjs
          node --check ../js/cardoria-live-publisher.js
          node --check ../js/cardoria-live-media.js
      - name: Camera 1 server guards
        working-directory: .
        run: |
          grep -q 'LIVE_CAMERA_VIDEO_TRACK_REQUIRED' backend/routes/live-realtime.js
          grep -q 'hasVideoTrack' backend/routes/live-realtime.js
          grep -q 'getVideoTracks' js/cardoria-live-publisher.js
          grep -q 'waitForPreview' js/cardoria-live-publisher.js
          grep -q 'videoProfile.*primary' js/cardoria-live-publisher.js
      - name: Start clean backend
        run: |
          rm -rf data
          node server.js > /tmp/cardoria-camera1-core.log 2>&1 &
          echo $! > /tmp/cardoria-camera1-core.pid
      - name: Wait for backend
        run: |
          ready=false
          for i in {1..90}; do
            if curl --fail --silent http://127.0.0.1:10000/api/health/startup > /tmp/cardoria-camera1-startup.json; then
              if grep -q '"ready":true' /tmp/cardoria-camera1-startup.json; then ready=true; break; fi
            fi
            sleep 1
          done
          test "$ready" = "true"
      - name: Camera 1 auth publish viewer stop reconnect E2E
        run: node scripts/camera1-core-e2e.mjs
      - name: Existing camera and realtime regressions
        run: |
          node --test tests/live-camera.test.mjs
          node --test tests/live-realtime-contract.test.mjs
      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/cardoria-camera1-core.pid ]; then kill $(cat /tmp/cardoria-camera1-core.pid) || true; fi
          cat /tmp/cardoria-camera1-core.log || true
