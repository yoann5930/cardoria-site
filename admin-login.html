<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Connexion admin Cardoria</title><meta name="description" content="Connexion sécurisée au back-office Cardoria."><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/style.css?v=20260828-preprod2"><link rel="icon" href="/assets/logo/cardoria-premium.png"><script src="/js/seo-config.js"></script><style>body{min-height:100vh;position:relative;overflow-x:hidden;background:radial-gradient(circle at 50% 32%,rgba(212,175,55,.08),transparent 34%),linear-gradient(145deg,#050505,#090909 52%,#020202);color:#fff8e8}body:before{content:"";position:fixed;inset:0;background:url('/assets/logo/cardoria-premium.png') center 38%/min(68vw,760px) auto no-repeat;opacity:.065;filter:drop-shadow(0 0 36px rgba(212,175,55,.22));pointer-events:none;z-index:0}.admin-login-top{position:relative;z-index:2;min-height:120px}.admin-login-top .container{display:flex;justify-content:center;align-items:center;padding-top:28px}.admin-login-top img{width:min(240px,46vw);height:auto;object-fit:contain;filter:drop-shadow(0 8px 28px rgba(0,0,0,.65))}.admin-login-main{position:relative;z-index:2}.admin-login-main .login{max-width:560px;margin:18px auto 54px;background:rgba(10,10,12,.86);backdrop-filter:blur(12px);border:1px solid rgba(212,175,55,.24);box-shadow:0 28px 80px rgba(0,0,0,.48)}.admin-login-footer{position:relative;z-index:2;text-align:center;padding:24px}.admin-login-footer img{width:110px;height:auto;opacity:.85}@media(max-width:640px){body:before{background-size:88vw auto}.admin-login-top{min-height:96px}.admin-login-top img{width:min(210px,62vw)}}</style></head><body><header class="admin-login-top"><div class="container"><a href="index.html" aria-label="Cardoria — Accueil"><img src="/assets/logo/cardoria-premium.png" alt="Cardoria"></a></div></header><main class="container admin-login-main"><section class="login panel"><h1>Admin Cardoria</h1><p class="small">Connexion directe sécurisée avec votre e-mail administrateur et votre mot de passe.</p><form id="adminPasswordLoginForm"><label for="adminEmail">E-mail administrateur</label><input id="adminEmail" type="email" placeholder="E-mail administrateur" autocomplete="username" required><label for="adminPassword">Mot de passe</label><input id="adminPassword" type="password" autocomplete="current-password" required><button class="primary" type="submit">Se connecter</button></form><p id="loginSuccess" class="small" style="margin-top:12px"></p><p id="loginError" class="error"></p><hr style="margin:24px 0"><p class="small">Le lien magique par e-mail reste disponible en secours.</p><form id="adminEmailLoginForm"><button type="submit" class="btn btn-secondary">Recevoir un lien par e-mail</button></form></section></main><footer class="admin-login-footer"><img src="/assets/logo/cardoria-premium.png" alt="Cardoria"><p class="small">Cardoria — accès administrateur sécurisé</p></footer><script src="/js/admin/admin-login-secure.js?v=20260828-preprod2"></script></body></html>
