<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réinitialisation du mot de passe — Cardoria Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="/style.css?v=20260905-password-reset-1">
  <link rel="icon" href="/assets/logo/cardoria-premium.png">
  <script src="/js/seo-config.js"></script>
</head>
<body>
  <header class="header"><div class="container nav"><a class="brand" href="/"><img src="/assets/logo/cardoria-premium.png" onerror="this.onerror=null;this.src='/logo-cardoria.jpg'" alt="Cardoria"><span>CARDORIA</span></a></div></header>
  <main class="container">
    <section class="login panel">
      <h1>Réinitialiser mon mot de passe</h1>
      <div id="requestBlock">
        <label for="resetEmail">E-mail administrateur</label>
        <input id="resetEmail" type="email" placeholder="admin@cardoriashop.fr" autocomplete="email" required>
        <button class="primary" type="button" id="requestReset">Envoyer le lien de réinitialisation</button>
      </div>
      <div id="confirmBlock" style="display:none">
        <label for="newPassword">Nouveau mot de passe</label>
        <input id="newPassword" type="password" minlength="10" maxlength="128" autocomplete="new-password" placeholder="10 caractères minimum" required>
        <label for="confirmPassword">Confirmer le nouveau mot de passe</label>
        <input id="confirmPassword" type="password" minlength="10" maxlength="128" autocomplete="new-password" required>
        <button class="primary" type="button" id="confirmReset">Enregistrer le nouveau mot de passe</button>
      </div>
      <p id="resetMsg" class="small" style="margin-top:12px" aria-live="polite"></p>
      <p class="small"><a href="/admin-login.html">Retour à la connexion</a></p>
    </section>
  </main>
  <script>
  (function () {
    "use strict";
    var BACKEND = (window.CARDORIA_SEO && CARDORIA_SEO.backendUrl) || "";
    var token = new URLSearchParams(location.search).get("token") || "";
    var msg = document.getElementById("resetMsg");
    var requestButton = document.getElementById("requestReset");
    var confirmButton = document.getElementById("confirmReset");

    if (token) {
      document.getElementById("requestBlock").style.display = "none";
      document.getElementById("confirmBlock").style.display = "block";
    }

    async function readJson(response) {
      var type = String(response.headers.get("content-type") || "").toLowerCase();
      if (!type.includes("application/json")) throw new Error("Réponse serveur invalide.");
      return response.json();
    }

    requestButton.onclick = async function () {
      var email = document.getElementById("resetEmail").value.trim();
      if (!email) { msg.textContent = "Indiquez votre adresse e-mail."; return; }
      requestButton.disabled = true;
      msg.textContent = "Envoi en cours…";
      try {
        var response = await fetch(BACKEND + "/api/auth/password/request", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email })
        });
        var data = await readJson(response);
        if (!response.ok || !data.ok) throw new Error(data.error || "Envoi impossible.");
        msg.textContent = data.message || "Consultez votre boîte e-mail.";
      } catch (error) {
        msg.textContent = error.message || "Envoi impossible.";
      } finally {
        requestButton.disabled = false;
      }
    };

    confirmButton.onclick = async function () {
      var password = document.getElementById("newPassword").value;
      var confirmation = document.getElementById("confirmPassword").value;
      if (password.length < 10 || !/[A-Za-z]/.test(password) || !/\d/.test(password)) {
        msg.textContent = "Utilisez au moins 10 caractères avec une lettre et un chiffre.";
        return;
      }
      if (password !== confirmation) {
        msg.textContent = "Les deux mots de passe ne correspondent pas.";
        return;
      }
      confirmButton.disabled = true;
      msg.textContent = "Mise à jour en cours…";
      try {
        var response = await fetch(BACKEND + "/api/auth/password/confirm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: token, password: password })
        });
        var data = await readJson(response);
        if (!response.ok || !data.ok) throw new Error(data.error || "Réinitialisation impossible.");
        history.replaceState({}, "", location.pathname);
        msg.textContent = "Mot de passe mis à jour. Redirection…";
        setTimeout(function () { location.replace("/admin-login.html"); }, 1200);
      } catch (error) {
        msg.textContent = error.message || "Réinitialisation impossible.";
        confirmButton.disabled = false;
      }
    };
  })();
  </script>
</body>
</html>
