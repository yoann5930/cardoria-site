name: Cardoria Password Reset Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cardoria-password-reset-once.yml"

jobs:
  request-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request Cardoria admin password reset
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status=$(curl --silent --show-error --location \
            --connect-timeout 20 --max-time 60 \
            --output "$response_file" --write-out "%{http_code}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"email":"Cardoria59330@gmail.com"}' \
            "https://cardoria-site-2.onrender.com/api/auth/password/request")
          cat "$response_file"
          echo
          test "$status" = "200"
