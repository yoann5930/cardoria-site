name: Cardoria Production CI

on:
  push:
    branches: [main, fix/cardoria-production-stability-v2]
  pull_request:
    branches: [main]

jobs:
  production-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: '10000'
      LEGACY_ADMIN_CODE: 'false'
      ADMIN_AUTH_DISABLED: 'false'
      ADMIN_INITIAL_PASSWORD: 'Cardoria-CI-Only-Password-2026!'
      ADMIN_EMAIL: 'ci-admin@cardoria.invalid'
      CORS_ORIGINS: 'http://127.0.0.1:10000'
      ALERT_EMAIL: 'false'
      MARKETPLACE_DEMO_MODE: 'false'
      CSRF_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - name: Install backend
        run: npm install --omit=dev
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=low
      - name: Syntax checks
        run: |
          node --check server.js
          node --check routes/auth.js
          node --check routes/payments.js
          node --check routes/payments-admin.js
          node --check routes/marketplace-paypal.js
          node --check lib/boutique/stock.js
          node --check lib/boutique/catalog.js
          node --check lib/boutique/checkout.js
          node --check lib/payments/revolut.js
          node --check lib/marketplace/paypal.js
          node --check lib/marketplace/persistence.js
          node --check lib/purchase-persistence-bootstrap.js
      - name: Current payment and stock architecture guards
        working-directory: .
        run: |
          grep -q 'listBoutiqueInventory' backend/routes/payments-admin.js
          grep -q 'refundRevolutOrder' backend/routes/payments-admin.js
          grep -q 'revolut_admin_sync' backend/routes/payments-admin.js
          grep -q 'revolut_admin_refund' backend/routes/payments-admin.js
          grep -q 'provider: "revolut"' backend/routes/payments-admin.js
          grep -q 'sync-sumup' backend/routes/payments.js
          grep -q 'status(410)' backend/routes/payments.js
          grep -q 'listBoutiqueProducts' backend/lib/boutique/catalog.js
          grep -q 'listBoutiqueInventory' backend/lib/boutique/catalog.js
          grep -q 'pendingStock' backend/lib/boutique/stock.js
          grep -q 'soldStock' backend/lib/boutique/stock.js
          grep -q 'refundHoldStock' backend/lib/boutique/stock.js
          grep -q 'boutique-inventory' js/admin/admin-stock.js
          grep -q 'MARKETPLACE_COMMISSION_PERCENT' backend/lib/marketplace/paypal.js
          grep -q 'PAYPAL_PARTNER_MERCHANT_ID' backend/lib/marketplace/paypal.js
          if grep -q 'refundSumUpTransaction' backend/routes/payments-admin.js; then
            echo 'Active admin refund must not return to SumUp'
            exit 1
          fi
          if grep -q 'sumup_admin_sync\|sumup_admin_refund' backend/routes/payments-admin.js; then
            echo 'Active admin SumUp actions detected'
            exit 1
          fi
      - name: Persistence architecture guards
        working-directory: .
        run: |
          grep -q 'cardoria_purchase_snapshot' backend/lib/purchase-persistence-bootstrap.js
          grep -q 'purchasePersistence: "cardoria_purchase_snapshot"' backend/lib/marketplace/persistence.js
          grep -q 'purchases are intentionally NOT restored here' backend/lib/marketplace/persistence.js
          grep -q 'MARKETPLACE_DATABASE_URL' backend/lib/marketplace/persistence.js
      - name: Reject security regressions
        working-directory: .
        run: |
          if grep -R -n 'ADMIN_CODE_LOCAL="CARDORIA59330"\|const ADMIN_CODE_LOCAL="CARDORIA59330"' script.js js *.html 2>/dev/null; then exit 1; fi
          if grep -R -n 'ADMIN_AUTH_DISABLED.*true' backend render.yaml 2>/dev/null; then exit 1; fi
          if grep -R -n 'api/marketplace/listings\|api/marketplace/orders?email' js *.html 2>/dev/null; then exit 1; fi
          if git grep -I -nE 'SMTP_PASS[[:space:]]*=[[:space:]]*[^[:space:]#]+' -- . ':!.github/workflows' ':!backend/node_modules' ':!**/node_modules/**'; then exit 1; fi
      - name: Start backend
        run: |
          node server.js > /tmp/cardoria-backend.log 2>&1 &
          echo $! > /tmp/cardoria-backend.pid
      - name: Wait for backend
        run: |
          ready=false
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:10000/api/health/startup > /tmp/startup.json && grep -q '"ready":true' /tmp/startup.json; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = "true"
      - name: Public and protected route smoke tests
        run: |
          curl --fail --silent http://127.0.0.1:10000/api/health/ | grep -q '"version":"6.0.0"'
          curl --fail --silent http://127.0.0.1:10000/boutique.html | grep -q 'shopPostalCode'
          curl --fail --silent http://127.0.0.1:10000/api/payments/boutique/products | grep -q '"ok":true'
          curl --fail --silent 'http://127.0.0.1:10000/api/marketplace/v1/search?license=pokemon' | grep -q '"ok":true'
          for path in /api/admin/dashboard /api/admin/users /api/admin/payments/summary /api/admin/payments/boutique-inventory /api/admin/marketplace/orders /api/admin/accounting/summary; do
            code=$(curl -sS -o /tmp/protected.json -w "%{http_code}" "http://127.0.0.1:10000${path}")
            test "$code" = "401"
          done
      - name: Security headers present
        run: |
          curl -sSI http://127.0.0.1:10000/ > /tmp/headers.txt
          grep -qi '^content-security-policy:' /tmp/headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/headers.txt
          grep -qi '^x-frame-options: DENY' /tmp/headers.txt
      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/cardoria-backend.pid ]; then kill $(cat /tmp/cardoria-backend.pid) || true; fi
          cat /tmp/cardoria-backend.log || true
