name: Patch Live Schedule Archives Once
on:
  push:
    branches: [feat/live-schedule-archives-20260916]
    paths: ['.github/workflows/patch-live-schedule-archives-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add scheduling and automatic live archives
        shell: bash
        run: |
          set -euo pipefail

          cat > backend/lib/live/archive.js <<'EOF'
          import { readJson, writeJson } from "../storage.js";
          import { getLiveSession, listLiveCheckouts } from "./sessions.js";

          const STORE_KEY="live-archives.json";
          const PAID=new Set(["paid","completed","authorized","authorised"]);
          const money=(v)=>Math.round((Number(v)||0)*100)/100;
          const clean=(v,m=300)=>String(v==null?"":v).trim().slice(0,m);
          function load(){const d=readJson(STORE_KEY,{archives:[]});if(!Array.isArray(d.archives))d.archives=[];return d;}
          function save(d){writeJson(STORE_KEY,d);}
          function buyerKey(c){return clean(c.customerEmail,254).toLowerCase()||clean(c.customerName,120).toLowerCase()||"acheteur-inconnu";}
          export function buildLiveArchive(session,checkouts=[]){
            if(!session)throw Object.assign(new Error("Live introuvable."),{status:404});
            const rows=(checkouts||[]).map((c)=>({
              id:c.id,
              checkoutId:c.id,
              pseudo:clean(c.customerName,120)||clean(c.customerEmail,254)||"Client Live",
              customerName:clean(c.customerName,120),
              customerEmail:clean(c.customerEmail,254).toLowerCase(),
              productId:clean(c.productId,120),
              productName:clean(c.productName,180),
              qty:Math.max(1,Number(c.qty)||1),
              spotLabel:clean(c.spotLabel,120),
              status:clean(c.status,40).toLowerCase(),
              paid:PAID.has(clean(c.status,40).toLowerCase()),
              unitPrice:money(c.unitPrice),
              itemAmount:money(c.itemAmount),
              shippingAmount:money(c.shippingAmount),
              shippingPackId:clean(c.shippingPackId,80),
              shippingCarrier:clean(c.shippingCarrier,120),
              shippingWeightGrams:Math.max(0,Number(c.shippingWeightGrams)||0),
              amount:money(c.amount),
              provider:clean(c.provider||c.paymentProvider,40),
              paymentProviderOrderId:clean(c.paymentProviderOrderId,160),
              paymentProviderTransactionId:clean(c.paymentProviderTransactionId,160),
              createdAt:c.createdAt||"",
              updatedAt:c.updatedAt||""
            }));
            const map=new Map();
            for(const row of rows){
              const key=buyerKey(row);
              if(!map.has(key))map.set(key,{pseudo:row.pseudo,customerName:row.customerName,customerEmail:row.customerEmail,purchases:[],paidPurchases:[],totalPaid:0,totalShippingPaid:0,totalWeightGrams:0,shippingCarrier:"",shippingPackId:""});
              const buyer=map.get(key);buyer.purchases.push(row);
              if(row.paid){buyer.paidPurchases.push(row);buyer.totalPaid=money(buyer.totalPaid+row.amount);buyer.totalShippingPaid=money(buyer.totalShippingPaid+row.shippingAmount);buyer.totalWeightGrams+=row.shippingWeightGrams;if(row.shippingCarrier)buyer.shippingCarrier=row.shippingCarrier;if(row.shippingPackId)buyer.shippingPackId=row.shippingPackId;}
            }
            const buyers=[...map.values()].sort((a,b)=>String(a.pseudo).localeCompare(String(b.pseudo),"fr"));
            const paidRows=rows.filter((r)=>r.paid);
            return{
              id:"ARCH-"+session.id,
              liveId:session.id,
              title:session.title,
              ownerRole:session.ownerRole,
              ownerId:session.ownerId,
              paymentProvider:session.paymentProvider,
              scheduledAt:session.scheduledAt||"",
              startedAt:session.startedAt||"",
              endedAt:session.endedAt||new Date().toISOString(),
              archivedAt:new Date().toISOString(),
              buyers,
              purchases:rows,
              totals:{buyers:buyers.filter((b)=>b.paidPurchases.length).length,checkouts:rows.length,paidPurchases:paidRows.length,paidAmount:money(paidRows.reduce((s,r)=>s+r.amount,0)),shippingAmount:money(paidRows.reduce((s,r)=>s+r.shippingAmount,0))}
            };
          }
          export function archiveLiveSession(liveId){
            const session=getLiveSession(liveId);if(!session)throw Object.assign(new Error("Live introuvable."),{status:404});
            const archive=buildLiveArchive(session,listLiveCheckouts({liveId:session.id}));
            const d=load(),i=d.archives.findIndex((a)=>a.liveId===session.id);
            if(i>=0)d.archives[i]=archive;else d.archives.unshift(archive);
            d.archives=d.archives.slice(0,1000);save(d);return archive;
          }
          export function listLiveArchives({ownerId,ownerRole}={}){let a=load().archives||[];if(ownerId)a=a.filter((x)=>String(x.ownerId)===String(ownerId));if(ownerRole)a=a.filter((x)=>x.ownerRole===ownerRole);return a;}
          export function getLiveArchive(id){return(load().archives||[]).find((a)=>a.id===String(id||"")||a.liveId===String(id||""))||null;}
          EOF

          cat > js/live-schedule-archive.js <<'EOF'
          (function(){
            "use strict";
            var A=window.CardoriaAdmin;
            if(!A)return;
            function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}
            function euro(v){return Number(v||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});}
            function formatDate(v){if(!v)return"—";var d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString("fr-FR");}
            function root(){return document.querySelector(".admin-main")||document.body;}
            function ensureUi(){
              if(document.getElementById("liveScheduleArchivePanel"))return;
              var panel=document.createElement("section");panel.id="liveScheduleArchivePanel";panel.className="live-schedule-archive";
              panel.innerHTML="<div class='live-schedule-head'><div><h2>Programmation & archives Live</h2><p>Programme un direct et retrouve automatiquement les achats à la fin du Live pour préparer les envois.</p></div><button type='button' id='liveScheduleBtn' class='btn btn-primary'>Programmer un Live</button></div><div id='liveScheduleForm' class='live-schedule-form' hidden><label>Titre du Live<input id='liveScheduleTitle' maxlength='160' placeholder='Ex. Live Pokémon du vendredi'></label><label>Date et heure<input id='liveScheduleAt' type='datetime-local'></label><div><button type='button' id='liveScheduleSave' class='btn btn-primary'>Enregistrer</button> <button type='button' id='liveScheduleCancel' class='btn'>Annuler</button></div></div><div class='live-archive-head'><h3>Archives des Lives terminés</h3><button type='button' id='liveArchiveRefresh' class='btn'>Actualiser</button></div><div id='liveArchiveList' class='live-archive-list'>Chargement…</div><div id='liveArchiveDetail' class='live-archive-detail'></div>";
              root().appendChild(panel);
              document.getElementById("liveScheduleBtn").onclick=function(){document.getElementById("liveScheduleForm").hidden=false;var input=document.getElementById("liveScheduleAt");if(!input.value){var d=new Date(Date.now()+3600000),pad=function(n){return String(n).padStart(2,"0");};input.value=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes());}};
              document.getElementById("liveScheduleCancel").onclick=function(){document.getElementById("liveScheduleForm").hidden=true;};
              document.getElementById("liveScheduleSave").onclick=scheduleLive;
              document.getElementById("liveArchiveRefresh").onclick=loadArchives;
              loadArchives();
            }
            function scheduleLive(){
              var title=String(document.getElementById("liveScheduleTitle").value||"").trim(),raw=document.getElementById("liveScheduleAt").value;
              if(!title)return alert("Indique le titre du Live.");if(!raw)return alert("Choisis la date et l'heure.");
              var d=new Date(raw);if(Number.isNaN(d.getTime()))return alert("Date ou heure invalide.");if(d.getTime()<=Date.now())return alert("La programmation doit être dans le futur.");
              A.adminFetch("/api/admin/live/sessions",{method:"POST",body:JSON.stringify({title:title,ownerRole:"admin",scheduledAt:d.toISOString(),products:[]})}).then(function(){document.getElementById("liveScheduleForm").hidden=true;document.getElementById("liveScheduleTitle").value="";alert("Live programmé pour "+formatDate(d.toISOString())+".");location.reload();}).catch(function(e){alert(e.message);});
            }
            function loadArchives(){
              var list=document.getElementById("liveArchiveList");if(!list)return;list.textContent="Chargement…";
              A.adminFetch("/api/admin/live/archives").then(function(d){var archives=d.archives||[];if(!archives.length){list.innerHTML="<p>Aucune archive Live pour le moment.</p>";return;}list.innerHTML=archives.map(function(a){return "<button type='button' class='live-archive-card' data-archive='"+esc(a.liveId)+"'><strong>"+esc(a.title||a.liveId)+"</strong><span>Fin : "+esc(formatDate(a.endedAt))+"</span><span>"+Number(a.totals&&a.totals.buyers||0)+" acheteur(s) · "+Number(a.totals&&a.totals.paidPurchases||0)+" achat(s) payé(s) · "+euro(a.totals&&a.totals.paidAmount||0)+"</span></button>";}).join("");list.querySelectorAll("[data-archive]").forEach(function(b){b.onclick=function(){openArchive(b.dataset.archive);};});}).catch(function(e){list.textContent=e.message;});
            }
            function openArchive(liveId){A.adminFetch("/api/admin/live/archives/"+encodeURIComponent(liveId)).then(function(d){renderArchive(d.archive);}).catch(function(e){alert(e.message);});}
            function renderArchive(a){
              var box=document.getElementById("liveArchiveDetail");if(!box||!a)return;
              var buyerRows=(a.buyers||[]).map(function(b){var items=(b.paidPurchases||[]).map(function(p){return esc(p.productName)+(p.spotLabel?" — "+esc(p.spotLabel):"")+" × "+Number(p.qty||1)+" ("+euro(p.amount)+")";}).join("<br>")||"Aucun achat payé";return "<tr><td><strong>"+esc(b.pseudo||"Client")+"</strong><br><small>"+esc(b.customerEmail||"")+"</small></td><td>"+items+"</td><td>"+Math.round(Number(b.totalWeightGrams||0))+" g</td><td>"+esc(b.shippingCarrier||"—")+"<br><small>"+esc(b.shippingPackId||"")+"</small></td><td>"+euro(b.totalShippingPaid||0)+"</td><td>"+euro(b.totalPaid||0)+"</td></tr>";}).join("");
              box.innerHTML="<div class='live-archive-title'><div><h3>"+esc(a.title||a.liveId)+"</h3><p>Début : "+esc(formatDate(a.startedAt))+" · Fin : "+esc(formatDate(a.endedAt))+"</p></div><button type='button' id='liveArchiveCsv' class='btn'>Exporter CSV envois</button></div><div class='live-archive-summary'><strong>"+Number(a.totals&&a.totals.buyers||0)+" acheteur(s)</strong><span>"+Number(a.totals&&a.totals.paidPurchases||0)+" achat(s) payé(s)</span><span>Total : "+euro(a.totals&&a.totals.paidAmount||0)+"</span><span>Port encaissé : "+euro(a.totals&&a.totals.shippingAmount||0)+"</span></div><div class='live-archive-table-wrap'><table><thead><tr><th>Pseudo / client</th><th>Achats</th><th>Poids</th><th>Envoi prévu</th><th>Port payé</th><th>Total payé</th></tr></thead><tbody>"+(buyerRows||"<tr><td colspan='6'>Aucun achat payé.</td></tr>")+"</tbody></table></div><p class='live-archive-note'>L'archive conserve aussi les paiements en attente/refusés pour contrôle, mais le tableau d'envoi affiche les achats payés.</p>";
              document.getElementById("liveArchiveCsv").onclick=function(){exportCsv(a);};
            }
            function exportCsv(a){
              var rows=[["Pseudo","Email","Articles","Poids g","Transporteur","Pack","Port paye","Total paye"]];
              (a.buyers||[]).filter(function(b){return(b.paidPurchases||[]).length;}).forEach(function(b){var items=(b.paidPurchases||[]).map(function(p){return p.productName+(p.spotLabel?" - "+p.spotLabel:"")+" x"+(p.qty||1);}).join(" | ");rows.push([b.pseudo||"",b.customerEmail||"",items,b.totalWeightGrams||0,b.shippingCarrier||"",b.shippingPackId||"",b.totalShippingPaid||0,b.totalPaid||0]);});
              var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"';}).join(";");}).join("\n"),blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download="archive-live-"+(a.liveId||"cardoria")+".csv";document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url);
            }
            var timer=setInterval(ensureUi,800);document.addEventListener("DOMContentLoaded",ensureUi);ensureUi();window.addEventListener("beforeunload",function(){clearInterval(timer);});
          })();
          EOF
          cp js/live-schedule-archive.js backend/public/js/live-schedule-archive.js

          cat > css/live-schedule-archive.css <<'EOF'
          .live-schedule-archive{margin:18px 8px 28px;padding:16px;border:1px solid rgba(214,174,55,.35);border-radius:14px;background:#090b10;color:#f4f4f4}.live-schedule-head,.live-archive-head,.live-archive-title{display:flex;justify-content:space-between;gap:12px;align-items:center}.live-schedule-head h2,.live-archive-head h3,.live-archive-title h3{margin:0}.live-schedule-head p,.live-archive-title p{margin:5px 0;color:#c9c9c9}.live-schedule-form{display:grid;grid-template-columns:2fr 1fr auto;gap:10px;align-items:end;margin:14px 0;padding:12px;border:1px solid rgba(214,174,55,.25);border-radius:10px}.live-schedule-form label{display:grid;gap:5px;font-weight:700}.live-schedule-form input{min-height:42px;border-radius:8px;padding:8px 10px}.live-archive-head{margin-top:18px}.live-archive-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}.live-archive-card{display:grid;gap:4px;text-align:left;padding:12px;border:1px solid rgba(214,174,55,.28);border-radius:10px;background:#11141b;color:#fff;cursor:pointer}.live-archive-card:hover{border-color:#d6ae37}.live-archive-card span{font-size:12px;color:#c8c8c8}.live-archive-detail{margin-top:16px}.live-archive-summary{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.live-archive-summary>*{padding:6px 9px;border-radius:999px;background:#151922}.live-archive-table-wrap{overflow:auto}.live-archive-table-wrap table{width:100%;border-collapse:collapse}.live-archive-table-wrap th,.live-archive-table-wrap td{padding:9px;border-bottom:1px solid rgba(255,255,255,.09);vertical-align:top;text-align:left}.live-archive-note{font-size:12px;color:#aeb3bd}.live-schedule-archive .btn{min-height:40px}.live-schedule-archive .btn-primary{background:#2f8d59;color:#fff}@media(max-width:1000px){.live-archive-list{grid-template-columns:1fr 1fr}.live-schedule-form{grid-template-columns:1fr 1fr}.live-schedule-form>div{grid-column:1/-1}}@media(max-width:650px){.live-schedule-head,.live-archive-head,.live-archive-title{align-items:stretch;flex-direction:column}.live-archive-list,.live-schedule-form{grid-template-columns:1fr}}
          EOF
          cp css/live-schedule-archive.css backend/public/css/live-schedule-archive.css

          python - <<'PY'
          from pathlib import Path

          # Admin routes: automatic archive on stop + archive APIs.
          p=Path('backend/routes/live-admin.js'); s=p.read_text()
          anchor='import {\n  drawGiveaway, getLiveActionState, pinLiveProduct, startAuction, startBreak,\n  startFlashSale, startGiveaway, stopAuction, unpinLiveProduct\n} from "../lib/live/actions.js";\n'
          if anchor not in s: raise SystemExit('live-admin import anchor missing')
          s=s.replace(anchor,anchor+'import { archiveLiveSession, getLiveArchive, listLiveArchives } from "../lib/live/archive.js";\n',1)
          old='router.post("/sessions/:id/stop", WRITE_ADMIN, (req, res) => { try { const session = setLiveStatus(req.params.id, "ended", actor(req), { adminOverride: true }); logAudit({ type: "live", action: "admin_live_stopped", user: req.authUser?.email || "admin", detail: session.id }); res.json({ ok: true, provider: session.paymentProvider, session: publicLiveSession(session) }); } catch (error) { fail(res, error); } });'
          new='router.post("/sessions/:id/stop", WRITE_ADMIN, (req, res) => { try { const session = setLiveStatus(req.params.id, "ended", actor(req), { adminOverride: true }); const archive=archiveLiveSession(session.id); logAudit({ type: "live", action: "admin_live_stopped", user: req.authUser?.email || "admin", detail: session.id }); res.json({ ok: true, provider: session.paymentProvider, session: publicLiveSession(session), archive }); } catch (error) { fail(res, error); } });'
          if old not in s: raise SystemExit('live-admin stop anchor missing')
          s=s.replace(old,new,1)
          insert='router.get("/archives", (req, res) => { res.json({ ok: true, archives: listLiveArchives() }); });\nrouter.get("/archives/:id", (req, res) => { const archive=getLiveArchive(req.params.id); if(!archive)return res.status(404).json({ok:false,error:"Archive Live introuvable."}); res.json({ok:true,archive}); });\n'
          marker='router.get("/checkouts", (req, res) => res.json({ ok: true, checkouts: listLiveCheckouts({ liveId: req.query.liveId }) }));\n'
          if marker not in s: raise SystemExit('live-admin archive marker missing')
          s=s.replace(marker,insert+marker,1); p.write_text(s)

          # Studio stop path also archives automatically.
          p=Path('backend/routes/live-admin-studio.js'); s=p.read_text()
          imp='import { drawGiveaway, getLiveActionState, pinLiveProduct, setLiveProductEnergyTypes, startAuction, startBreak, startFlashSale, startGiveaway, stopAuction, unpinLiveProduct } from "../lib/live/actions.js";\n'
          if imp not in s: raise SystemExit('studio import anchor missing')
          s=s.replace(imp,imp+'import { archiveLiveSession } from "../lib/live/archive.js";\n',1)
          old='router.post("/:liveId/stop",(req,res)=>{try{const {actor}=actorFor(req,req.params.liveId);const session=setLiveStatus(req.params.liveId,"ended",actor,{adminOverride:true});res.json({ok:true,session:publicLiveSession(session)});}catch(error){fail(res,error);}});'
          new='router.post("/:liveId/stop",(req,res)=>{try{const {actor}=actorFor(req,req.params.liveId);const session=setLiveStatus(req.params.liveId,"ended",actor,{adminOverride:true});const archive=archiveLiveSession(session.id);res.json({ok:true,session:publicLiveSession(session),archive});}catch(error){fail(res,error);}});'
          if old not in s: raise SystemExit('studio stop anchor missing')
          p.write_text(s.replace(old,new,1))

          # Seller routes: same archive behavior and owner-scoped archive APIs.
          p=Path('backend/routes/live.js'); s=p.read_text()
          imp='import { createLiveSession, getLiveSession, listLiveCheckouts, listLiveSessions, publicLiveSession, resolveAdminLiveAccess, setLiveStatus, updateLiveSession } from "../lib/live/sessions.js";\n'
          if imp not in s: raise SystemExit('live import anchor missing')
          s=s.replace(imp,imp+'import { archiveLiveSession, getLiveArchive, listLiveArchives } from "../lib/live/archive.js";\n',1)
          old='router.post("/seller/sessions/:id/stop", (req, res) => { try { const actor = sellerActor(req); const session = setLiveStatus(req.params.id, "ended", actor); logAudit({ type: "live", action: "seller_live_stopped", user: actor.email || actor.sellerId, detail: session.id }); res.json({ ok: true, provider: "paypal", session: publicLiveSession(session) }); } catch (error) { fail(res, error, error instanceof MarketplaceAuthError ? error.status : 400); } });'
          new='router.post("/seller/sessions/:id/stop", (req, res) => { try { const actor = sellerActor(req); const session = setLiveStatus(req.params.id, "ended", actor); const archive=archiveLiveSession(session.id); logAudit({ type: "live", action: "seller_live_stopped", user: actor.email || actor.sellerId, detail: session.id }); res.json({ ok: true, provider: "paypal", session: publicLiveSession(session), archive }); } catch (error) { fail(res, error, error instanceof MarketplaceAuthError ? error.status : 400); } });'
          if old not in s: raise SystemExit('seller stop anchor missing')
          s=s.replace(old,new,1)
          marker='router.get("/seller/checkouts", (req, res) => { try { const actor = sellerActor(req); res.json({ ok: true, provider: "paypal", checkouts: listLiveCheckouts({ ownerId: actor.sellerId }) }); } catch (error) { fail(res, error, error instanceof MarketplaceAuthError ? error.status : 401); } });\n'
          insert='router.get("/seller/archives", (req, res) => { try { const actor=sellerActor(req); res.json({ok:true,provider:"paypal",archives:listLiveArchives({ownerId:actor.sellerId,ownerRole:"seller"})}); } catch(error){ fail(res,error,error instanceof MarketplaceAuthError?error.status:401); } });\nrouter.get("/seller/archives/:id", (req,res)=>{ try { const actor=sellerActor(req),archive=getLiveArchive(req.params.id); if(!archive||archive.ownerRole!=="seller"||String(archive.ownerId)!==String(actor.sellerId))return res.status(404).json({ok:false,error:"Archive Live introuvable."}); res.json({ok:true,provider:"paypal",archive}); } catch(error){ fail(res,error,error instanceof MarketplaceAuthError?error.status:401); } });\n'
          if marker not in s: raise SystemExit('seller archive marker missing')
          p.write_text(s.replace(marker,insert+marker,1))

          # Load the new admin UI without touching existing Live camera/sales scripts.
          for file in ['admin-live.html','backend/public/admin-live.html']:
              p=Path(file); s=p.read_text()
              css='<link rel="stylesheet" href="/css/live-schedule-archive.css?v=20260916-live-archive">\n'
              if css not in s:
                  s=s.replace('<link rel="stylesheet" href="/css/admin.css?v=20260912-studio-pr1">\n','<link rel="stylesheet" href="/css/admin.css?v=20260912-studio-pr1">\n'+css,1)
              script='<script src="/js/live-schedule-archive.js?v=20260916-live-archive"></script>\n'
              if script not in s:
                  s=s.replace('</body>',script+'</body>',1)
              p.write_text(s)
          PY

          cat > tests/live-archive.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { buildLiveArchive } from "../backend/lib/live/archive.js";
          test("live archive groups paid purchases by buyer for shipping",()=>{
            const archive=buildLiveArchive({id:"LIVE-1",title:"Test",ownerRole:"admin",ownerId:"cardoria",paymentProvider:"sumup",startedAt:"2026-09-16T01:00:00Z",endedAt:"2026-09-16T02:00:00Z"},[
              {id:"C1",customerName:"PikaFan",customerEmail:"pika@example.com",productName:"EV10",qty:2,status:"paid",amount:12,shippingAmount:2.29,shippingWeightGrams:40,shippingCarrier:"La Poste Lettre suivie",shippingPackId:"PACK-LS-100"},
              {id:"C2",customerName:"PikaFan",customerEmail:"pika@example.com",productName:"ME05",qty:1,status:"completed",amount:6,shippingAmount:1.60,shippingWeightGrams:20,shippingCarrier:"La Poste Lettre suivie",shippingPackId:"PACK-LS-100"},
              {id:"C3",customerName:"Other",customerEmail:"other@example.com",productName:"Lot",qty:1,status:"failed",amount:9}
            ]);
            assert.equal(archive.totals.buyers,1);assert.equal(archive.totals.paidPurchases,2);assert.equal(archive.buyers[0].pseudo,"PikaFan");assert.equal(archive.buyers[0].paidPurchases.length,2);assert.equal(archive.buyers[0].totalShippingPaid,3.89);
          });
          EOF

          node --check backend/lib/live/archive.js
          node --check backend/routes/live-admin.js
          node --check backend/routes/live-admin-studio.js
          node --check backend/routes/live.js
          node --check js/live-schedule-archive.js
          node --test tests/live-archive.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/lib/live/archive.js backend/routes/live-admin.js backend/routes/live-admin-studio.js backend/routes/live.js js/live-schedule-archive.js backend/public/js/live-schedule-archive.js css/live-schedule-archive.css backend/public/css/live-schedule-archive.css admin-live.html backend/public/admin-live.html tests/live-archive.test.mjs
          git commit -m 'feat(live): schedule lives and archive purchases for shipping'
          git push origin HEAD:feat/live-schedule-archives-20260916
