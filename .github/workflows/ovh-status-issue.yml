name: OVH Status Issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

concurrency:
  group: ovh-status-issue
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'ovh-status:')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Authorized owner-only OVH status request."

  status:
    needs: authorize
    uses: ./.github/workflows/ovh-ops-run.yml
    with:
      action: status
      branch: main
    secrets: inherit
