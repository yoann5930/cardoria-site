name: OVH Ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: Allowlisted VPS operation
        required: true
        type: choice
        options:
          - status
          - healthcheck
          - deploy
          - restart
          - backup
          - nginx-test
          - logs
          - rollback
          - report
          - backup-check
          - dns-check
          - https-enable
      branch:
        description: Authorized branch for deploy only
        required: false
        type: choice
        default: main
        options:
          - main
          - migration/oracle-free-20260902
          - migration/ovh-ops-20260903
          - migration/ovh-chatgpt-access-20260903
          - migration/ovh-https-cutover-20260903

permissions:
  contents: read

concurrency:
  group: ovh-ops-dispatch
  cancel-in-progress: false

jobs:
  ovh-ops:
    uses: ./.github/workflows/ovh-ops-run.yml
    with:
      action: ${{ inputs.action }}
      branch: ${{ inputs.branch }}
    secrets: inherit
