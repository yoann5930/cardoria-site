name: OVH Ops Run

on:
  workflow_call:
    inputs:
      action:
        required: true
        type: string
      branch:
        required: false
        type: string
        default: migration/oracle-free-20260902

permissions:
  contents: read

concurrency:
  group: ovh-ops-vps
  cancel-in-progress: false

jobs:
  ovh-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Run allowlisted VPS operation
        env:
          OVH_VPS_HOST: ${{ secrets.OVH_VPS_HOST }}
          OVH_VPS_USER: ${{ secrets.OVH_VPS_USER }}
          OVH_VPS_SSH_KEY: ${{ secrets.OVH_VPS_SSH_KEY }}
          OVH_VPS_HOST_FINGERPRINT: ${{ secrets.OVH_VPS_HOST_FINGERPRINT }}
          OP: ${{ inputs.action }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${OVH_VPS_HOST:-}"
          test -n "${OVH_VPS_USER:-}"
          test -n "${OVH_VPS_SSH_KEY:-}"
          test -n "${OVH_VPS_HOST_FINGERPRINT:-}"

          case "$OP" in
            status|healthcheck|deploy|restart|backup|nginx-test|logs|rollback|report|backup-check|dns-check|https-enable) ;;
            *) echo "FORBIDDEN action"; exit 1 ;;
          esac
          case "$BRANCH" in
            main|migration/oracle-free-20260902|migration/ovh-ops-20260903|migration/ovh-chatgpt-access-20260903|migration/ovh-https-cutover-20260903) ;;
            *) echo "FORBIDDEN branch"; exit 1 ;;
          esac

          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$OVH_VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          unset OVH_VPS_SSH_KEY

          ssh-keyscan -t ed25519 -T 10 "$OVH_VPS_HOST" > "$HOME/.ssh/known_hosts"
          got=$(ssh-keygen -lf "$HOME/.ssh/known_hosts" | awk '{print $2}')
          expected=$(printf '%s' "$OVH_VPS_HOST_FINGERPRINT" | tr -d '\r\n')
          if [ "$got" != "$expected" ]; then
            echo "Host fingerprint mismatch"
            exit 1
          fi
          echo "host_fingerprint: match"

          remote_cmd=$OP
          if [ "$OP" = deploy ]; then
            remote_cmd="deploy $BRANCH"
          fi

          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o ConnectTimeout=15 \
            "${OVH_VPS_USER}@${OVH_VPS_HOST}" \
            "$remote_cmd"
