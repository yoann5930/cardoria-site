<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Caméra Live Cardoria</title><style>body{margin:0;background:#05070b;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#10131a;border:1px solid #4b3d19;border-radius:16px;padding:16px}video{width:100%;max-height:70vh;background:#000;border-radius:12px}button,select{width:100%;padding:14px;margin-top:10px;border-radius:10px;font-size:16px}button{background:#f3c94f;border:0;font-weight:700}.muted{color:#bbb}</style></head><body><main class="wrap"><h1>Caméra 2 · Live Cardoria</h1><div class="card"><p class="muted">Ouvre ce lien sur le téléphone qui doit servir de deuxième caméra. Autorise la caméra et le micro, puis démarre.</p><select id="camera"><option value="">Caméra arrière / automatique</option></select><select id="micro"><option value="">Micro automatique</option></select><video id="preview" autoplay muted playsinline></video><button id="start">Démarrer la caméra 2</button><button id="stop" disabled>Arrêter</button><p id="status">Prêt.</p></div></main><script src="/js/cardoria-live-publisher.js"></script><script>(function(){var q=new URLSearchParams(location.search),pair=q.get('pair')||'',pub=null,cam=document.getElementById('camera'),mic=document.getElementById('micro'),status=document.getElementById('status');async function load(){try{var d=await CardoriaLivePublisher.devices();d.cameras.forEach(function(x,i){var o=document.createElement('option');o.value=x.deviceId;o.textContent=x.label||('Caméra '+(i+1));cam.appendChild(o)});d.microphones.forEach(function(x,i){var o=document.createElement('option');o.value=x.deviceId;o.textContent=x.label||('Micro '+(i+1));mic.appendChild(o)})}catch(e){}}document.getElementById('start').onclick=async function(){if(!pair){status.textContent='Lien caméra invalide.';return}try{status.textContent='Connexion…';pub=await CardoriaLivePublisher.publish({pairToken:pair,sourceId:'secondary',cameraId:cam.value,microphoneId:mic.value,preview:document.getElementById('preview')});status.textContent='Caméra 2 connectée au Live.';this.disabled=true;document.getElementById('stop').disabled=false}catch(e){status.textContent=e.message||'Connexion impossible.'}};document.getElementById('stop').onclick=async function(){if(pub)await pub.stop();status.textContent='Caméra arrêtée.';this.disabled=true};load()})();</script></body></html>
