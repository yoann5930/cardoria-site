# HTTP default: IP and local healthchecks stay on HTTP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 51.89.174.191 _;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:10000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# HTTP public names: ACME + canonical HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name cardoriashop.fr www.cardoriashop.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/cardoria-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://www.cardoriashop.fr$request_uri;
    }
}

# Apex HTTPS → canonical www.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cardoriashop.fr;

    ssl_certificate /etc/letsencrypt/live/cardoriashop.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cardoriashop.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://www.cardoriashop.fr$request_uri;
}

# Canonical HTTPS site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.cardoriashop.fr;

    ssl_certificate /etc/letsencrypt/live/cardoriashop.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cardoriashop.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:10000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
