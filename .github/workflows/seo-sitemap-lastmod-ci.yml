name: SEO sitemap dates CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - backend/lib/seo/**
      - backend/server.js
      - backend/lib/security/index.js
      - live-vendeur.html
      - backend/public/live-vendeur.html
      - live-camera.html
      - backend/public/live-camera.html
      - marketplace-paiement-succes.html
      - backend/public/marketplace-paiement-succes.html
      - marketplace-paiement-echec.html
      - backend/public/marketplace-paiement-echec.html
      - backend/routes/marketplace-v1.js
      - backend/lib/marketplace/listings.js
      - backend/lib/marketplace/v1/listings.js
      - js/marketplace-browse.js
      - backend/public/js/marketplace-browse.js
      - js/marketplace-seller.js
      - backend/public/js/marketplace-seller.js
      - js/marketplace-listing.js
      - backend/public/js/marketplace-listing.js
      - index.html
      - backend/public/index.html
      - js/seo.js
      - js/carte.js
      - scanner.html
      - backend/public/scanner.html
      - souhaits.html
      - backend/public/souhaits.html
      - panier-marketplace.html
      - backend/public/panier-marketplace.html
      - robots.txt
      - backend/public/robots.txt
      - tests/seo-*.mjs
      - tests/sitemap-404-indexing.test.mjs
      - scripts/audit-public-seo.mjs
      - scripts/generate-sitemap.mjs
      - .github/workflows/seo-sitemap-lastmod-ci.yml

permissions:
  contents: read

jobs:
  seo-sitemap-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.node-version
      - name: Check production modules and audit syntax
        run: |
          node --check backend/lib/seo/sitemap.js
          node --check backend/lib/seo/sitemap-urls.js
          node --check backend/lib/seo/card-render.js
          node --check backend/server.js
          node --check backend/lib/security/index.js
          node --check backend/routes/marketplace-v1.js
          node --check backend/lib/marketplace/listings.js
          node --check backend/lib/marketplace/v1/listings.js
          node --check js/marketplace-browse.js
          node --check js/marketplace-seller.js
          node --check js/marketplace-listing.js
          node --check js/seo.js
          node --check js/carte.js
          node --check scripts/audit-public-seo.mjs
      - name: Install test dependencies
        run: |
          npm --prefix backend install --ignore-scripts --omit=dev --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test sitemaps, redirects, initial HTML and Chromium rendering
        env:
          SEO_BROWSER_TESTS: '1'
        run: node --experimental-vm-modules --test tests/seo-sitemap-lastmod.test.mjs tests/seo-license-redirect.test.mjs tests/seo-card-render.test.mjs tests/seo-canonical-navigation.test.mjs tests/seo-private-technical-pages.test.mjs tests/sitemap-404-indexing.test.mjs
  public-seo-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.node-version
      - name: Read-only public SEO diagnostic (not an indexing guarantee)
        run: node scripts/audit-public-seo.mjs
