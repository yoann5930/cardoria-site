name: OVH Release Issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

concurrency:
  group: ovh-release-issue
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'ovh-release:') &&
      contains(github.event.issue.labels.*.name, 'ovh-ops:deploy') &&
      contains(github.event.issue.labels.*.name, 'ovh-branch:main')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Authorized owner-only OVH release request for main."

  backup:
    needs: authorize
    uses: ./.github/workflows/ovh-ops-run.yml
    with:
      action: backup
      branch: main
    secrets: inherit

  backup_check:
    needs: backup
    uses: ./.github/workflows/ovh-ops-run.yml
    with:
      action: backup-check
      branch: main
    secrets: inherit

  deploy:
    needs: backup_check
    uses: ./.github/workflows/ovh-ops-run.yml
    with:
      action: deploy
      branch: main
    secrets: inherit

  healthcheck:
    needs: deploy
    uses: ./.github/workflows/ovh-ops-run.yml
    with:
      action: healthcheck
      branch: main
    secrets: inherit

  report:
    needs: healthcheck
    uses: ./.github/workflows/ovh-ops-run.yml
    with:
      action: report
      branch: main
    secrets: inherit
