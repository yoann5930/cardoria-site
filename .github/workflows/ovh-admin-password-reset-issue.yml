name: OVH Admin Password Reset Issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

concurrency:
  group: ovh-admin-password-reset
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'ovh-admin-reset:') &&
      contains(github.event.issue.labels.*.name, 'ovh-ops:deploy')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Authorized owner-only admin password reset request."

  request_reset:
    needs: authorize
    uses: ./.github/workflows/ovh-ops-run.yml
    with:
      action: admin-password-reset-request
      branch: main
    secrets: inherit

  report:
    needs: request_reset
    uses: ./.github/workflows/ovh-ops-run.yml
    with:
      action: report
      branch: main
    secrets: inherit
