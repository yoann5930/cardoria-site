<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réinitialisation du mot de passe — Cardoria Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="/style.css?v=20260905-password-reset-2">
  <link rel="icon" href="/assets/logo/cardoria-premium.png">
</head>
<body>
  <header class="header">
    <div class="container nav">
      <a class="brand" href="/">
        <img src="/assets/logo/cardoria-premium.png" onerror="this.onerror=null;this.src='/logo-cardoria.jpg'" alt="Cardoria">
        <span>CARDORIA</span>
      </a>
    </div>
  </header>
  <main class="container">
    <section class="login panel">
      <h1>Réinitialiser mon mot de passe</h1>
      <div id="requestBlock">
        <label for="resetEmail">E-mail administrateur</label>
        <input id="resetEmail" type="email" placeholder="admin@cardoriashop.fr" autocomplete="email" required>
        <button class="primary" type="button" id="requestReset">Envoyer le lien de réinitialisation</button>
      </div>
      <div id="confirmBlock" style="display:none">
        <label for="newPassword">Nouveau mot de passe</label>
        <input id="newPassword" type="password" minlength="10" maxlength="128" autocomplete="new-password" placeholder="10 caractères minimum" required>
        <label for="confirmPassword">Confirmer le nouveau mot de passe</label>
        <input id="confirmPassword" type="password" minlength="10" maxlength="128" autocomplete="new-password" required>
        <button class="primary" type="button" id="confirmReset">Enregistrer le nouveau mot de passe</button>
      </div>
      <p id="resetMsg" class="small" style="margin-top:12px" aria-live="polite"></p>
      <p class="small"><a href="/admin-login.html">Retour à la connexion</a></p>
    </section>
  </main>
  <script src="/js/admin/admin-password-reset.js?v=20260905-password-reset-2"></script>
</body>
</html>
