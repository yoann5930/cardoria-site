name: Audit Fix Runtime Once
on:
  push:
    branches: [fix/audit-runtime-cache-sync-20260917]
    paths: ['.github/workflows/audit-fix-runtime-once.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply live runtime cache fix
        shell: bash
        run: |
          set -euo pipefail
          for file in admin-live.html backend/public/admin-live.html live-vendeur.html backend/public/live-vendeur.html; do
            sed -i -E 's#live-studio-sales-controls\.js\?v=[^" ]+#live-studio-sales-controls.js?v=20260917-energy-catalog-v2#g' "$file"
            grep -q 'live-studio-sales-controls.js?v=20260917-energy-catalog-v2' "$file"
          done
          ! grep -E 'live-studio-sales-controls\.js\?v=20260916-(energy-combos-v1|sales-controls-v3)' admin-live.html backend/public/admin-live.html live-vendeur.html backend/public/live-vendeur.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-live.html backend/public/admin-live.html live-vendeur.html backend/public/live-vendeur.html
          git commit -m 'fix(live): force current sales controls runtime'
          git push origin HEAD:fix/audit-runtime-cache-sync-20260917
