name: Patch Energy Game Catalog Once
on:
  push:
    branches: [fix/energy-game-config-no-lot-20260916]
    paths: ['.github/workflows/patch-energy-game-catalog-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch energy game no-lot catalog flow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # actions.js: internet-resolved energy games independent from a sale lot.
          p=Path('backend/lib/live/actions.js'); s=p.read_text()
          s=s.replace('import { decrementLiveStock, getLiveSession } from "./sessions.js";','import { decrementLiveStock, getLiveSession, listLiveCheckouts } from "./sessions.js";\nimport { resolveEnergyItems } from "./energy-catalog.js";')
          old='function refreshBreakProgress(liveId,state){if(!state?.break)return;const live=getLiveSession(liveId),product=(live?.products||[]).find((p)=>p.id===state.break.productId);if(!product)return;const start=Number(state.break.stockAtStart??state.break.spots),remainingStock=Math.max(0,Number(product.stock||0)),sold=Math.max(0,Math.min(Number(state.break.spots||0),start-remainingStock));state.break.soldSpots=sold;state.break.remainingSpots=Math.max(0,Number(state.break.spots||0)-sold);if(state.break.remainingSpots===0&&state.break.status==="running"){state.break.status="sold_out";state.break.endedAt=nowIso();}}'
          new='function refreshBreakProgress(liveId,state){if(!state?.break)return;if(state.break.breakType==="energy_game"){const active=new Set(["planned","pending","paid","completed","authorized","authorised"]),used=new Set(listLiveCheckouts({liveId}).filter((c)=>c.actionId===state.break.id&&active.has(String(c.status||"").toLowerCase())&&c.spotLabel).map((c)=>String(c.spotLabel)));state.break.soldSpots=Math.min(Number(state.break.spots||0),used.size);state.break.remainingSpots=Math.max(0,Number(state.break.spots||0)-state.break.soldSpots);if(state.break.remainingSpots===0&&state.break.status==="running"){state.break.status="sold_out";state.break.endedAt=nowIso();}return;}const live=getLiveSession(liveId),product=(live?.products||[]).find((p)=>p.id===state.break.productId);if(!product)return;const start=Number(state.break.stockAtStart??state.break.spots),remainingStock=Math.max(0,Number(product.stock||0)),sold=Math.max(0,Math.min(Number(state.break.spots||0),start-remainingStock));state.break.soldSpots=sold;state.break.remainingSpots=Math.max(0,Number(state.break.spots||0)-sold);if(state.break.remainingSpots===0&&state.break.status==="running"){state.break.status="sold_out";state.break.endedAt=nowIso();}}'
          if old not in s: raise SystemExit('refreshBreakProgress target missing')
          s=s.replace(old,new,1)
          marker='export function startBreak(liveId,{productId,spots=1,pricePerSpot,breakType="break",spotLabels,energySourceProductIds}={})'
          if marker not in s: raise SystemExit('startBreak marker missing')
          fn='''export async function startEnergyGame(liveId,{gamesCount=1,energyGames=[],pricePerSpot}={}){const live=requireLive(liveId),count=Math.max(1,Math.min(100,Math.trunc(Number(gamesCount)||1))),price=money(pricePerSpot);if(price<=0)throw Object.assign(new Error("Prix du spot invalide."),{status:400});if(!Array.isArray(energyGames)||energyGames.length<count)throw Object.assign(new Error("Configure chaque jeu avant de démarrer."),{status:400});const allowed=new Set(["box_break","sealed","unit","other"]),games=[],labels=[];for(let i=0;i<count;i++){const raw=energyGames[i]||{},type=allowed.has(String(raw.type||"").toLowerCase())?String(raw.type).toLowerCase():"other",items=(Array.isArray(raw.items)?raw.items:String(raw.items||"").split(/[+,;\\n]/)).map((x)=>clean(x,120)).filter(Boolean).slice(0,12);if(!items.length)throw Object.assign(new Error(`Jeu ${i+1} : indique au moins un item / une extension Pokémon.`),{status:400});const resolved=await resolveEnergyItems(items);if(!resolved.spots.length)throw Object.assign(new Error(`Jeu ${i+1} : aucune énergie exploitable trouvée.`),{status:409});const game={number:i+1,type,format:type==="box_break"||type==="sealed"?(String(raw.format||"display").toLowerCase()==="case"?"case":"display"):"",units:type==="unit"?Math.max(1,Math.min(1000,Math.trunc(Number(raw.units)||1))):0,detail:type==="other"?clean(raw.detail,120):"",items:resolved.items,spots:[...resolved.spots]};games.push(game);for(const spot of resolved.spots)labels.push(`Jeu ${i+1} — ${spot}`);}const{d,state}=stateFor(live.id,true),id="BRK-"+crypto.randomUUID();state.pinnedProductId="";state.break={id,productId:"ENERGY-"+id,productName:"Jeu de l’énergie",status:"running",breakType:"energy_game",label:"Jeu de l’énergie",virtualProduct:true,shippingWeightGrams:20,gamesCount:count,energyGames:games,spots:labels.length,spotLabels:labels,energySourceProductIds:[],energySourceNames:[],pricePerSpot:price,stockAtStart:labels.length,soldSpots:0,remainingSpots:labels.length,startedAt:nowIso()};state.updatedAt=nowIso();save(d);return structuredClone(state.break);}\n'''
          s=s.replace(marker,fn+marker,1)
          p.write_text(s)

          # Admin route: use async energy game engine.
          p=Path('backend/routes/live-admin-studio.js'); s=p.read_text()
          s=s.replace('startAuction, startBreak, startFlashSale, startGiveaway, stopAuction','startAuction, startBreak, startEnergyGame, startFlashSale, startGiveaway, stopAuction')
          old='router.post("/:liveId/actions/break/start",(req,res)=>{try{actorFor(req,req.params.liveId);res.json({ok:true,break:startBreak(req.params.liveId,req.body||{})});}catch(error){fail(res,error);}});'
          new='router.post("/:liveId/actions/break/start",async(req,res)=>{try{actorFor(req,req.params.liveId);const body=req.body||{},result=String(body.breakType||"").toLowerCase()==="energy_game"?await startEnergyGame(req.params.liveId,body):startBreak(req.params.liveId,body);res.json({ok:true,break:result});}catch(error){fail(res,error);}});'
          if old not in s: raise SystemExit('admin break route target missing')
          p.write_text(s.replace(old,new,1))

          # Seller/public routes: catalog endpoints + async energy game.
          p=Path('backend/routes/live-actions.js'); s=p.read_text()
          s=s.replace('startAuction, startBreak, startFlashSale, startGiveaway, stopAuction','startAuction, startBreak, startEnergyGame, startFlashSale, startGiveaway, stopAuction')
          s=s.replace('import { getLiveSession } from "../lib/live/sessions.js";','import { getLiveSession } from "../lib/live/sessions.js";\nimport { resolveEnergyItems, searchEnergyCatalog } from "../lib/live/energy-catalog.js";')
          anchor='router.get("/:liveId/state",(req,res)=>'
          if anchor not in s: raise SystemExit('public state route anchor missing')
          catalog='router.get("/energy-catalog/search",async(req,res)=>{try{res.json({ok:true,items:await searchEnergyCatalog(req.query.q||"",req.query.limit)});}catch(e){fail(res,e,502);}});\nrouter.get("/energy-catalog/resolve",async(req,res)=>{try{const items=String(req.query.items||"").split(/[+,;\\n]/).map((x)=>x.trim()).filter(Boolean);res.json({ok:true,...await resolveEnergyItems(items)});}catch(e){fail(res,e,502);}});\n'
          s=s.replace(anchor,catalog+anchor,1)
          old='router.post("/seller/:liveId/break/start",(req,res)=>{try{assertSellerOwner(req,req.params.liveId);res.json({ok:true,break:startBreak(req.params.liveId,req.body||{})});}catch(e){fail(res,e,401);}});'
          new='router.post("/seller/:liveId/break/start",async(req,res)=>{try{assertSellerOwner(req,req.params.liveId);const body=req.body||{},result=String(body.breakType||"").toLowerCase()==="energy_game"?await startEnergyGame(req.params.liveId,body):startBreak(req.params.liveId,body);res.json({ok:true,break:result});}catch(e){fail(res,e,401);}});'
          if old not in s: raise SystemExit('seller break route target missing')
          p.write_text(s.replace(old,new,1))

          # Checkout: recognize virtual energy-game product and preserve all existing payment routing.
          p=Path('backend/lib/live/checkout.js'); s=p.read_text()
          s=s.replace('import { resolveLiveSaleRule } from "./sale-rules.js";','import { resolveLiveSaleRule } from "./sale-rules.js";\nimport { getLiveActionState } from "./actions.js";')
          old='const route=assertSaleProvider({channel:"live",ownerRole:live.ownerRole,requestedProvider}),product=(live.products||[]).find(i=>i.id===String(productId||""));if(!product)throw Object.assign(new Error("Produit Live introuvable."),{status:404});'
          new='const route=assertSaleProvider({channel:"live",ownerRole:live.ownerRole,requestedProvider}),actionState=getLiveActionState(live.id),energyBreak=actionState.break?.breakType==="energy_game"&&actionState.break?.status==="running"?actionState.break:null;let product=(live.products||[]).find(i=>i.id===String(productId||""));if(!product&&energyBreak&&String(energyBreak.productId)===String(productId||""))product={id:energyBreak.productId,name:energyBreak.productName||"Jeu de l’énergie",mode:"break",price:energyBreak.pricePerSpot,stock:energyBreak.spots,qty:energyBreak.spots,shippingWeightGrams:Number(energyBreak.shippingWeightGrams||20),virtualProduct:true};if(!product)throw Object.assign(new Error("Produit Live introuvable."),{status:404});'
          if old not in s: raise SystemExit('checkout product target missing')
          s=s.replace(old,new,1)
          s=s.replace('quoteLiveShipping({liveId:live.id,customerEmail:email,productId:product.id,qty:units})','quoteLiveShipping({liveId:live.id,customerEmail:email,productId:product.id,qty:units,productOverride:product})',1)
          s=s.replace('shippingWeightGrams:shipping.totalWeightGrams||0,shippingBundled:true','shippingWeightGrams:shipping.totalWeightGrams||0,shippingUnitWeightGrams:Number(product.shippingWeightGrams||0),shippingBundled:true',1)
          p.write_text(s)

          # Shipping: virtual energy spots participate in the same grouping rules.
          p=Path('backend/lib/live/shipping.js'); s=p.read_text()
          s=s.replace('export function quoteLiveShipping({liveId,customerEmail,productId,qty=1,excludeCheckoutId=""}={}){','export function quoteLiveShipping({liveId,customerEmail,productId,qty=1,excludeCheckoutId="",productOverride=null}={}){',1)
          s=s.replace('const product=(live.products||[]).find((item)=>String(item.id)===String(productId||""));','const product=productOverride||(live.products||[]).find((item)=>String(item.id)===String(productId||""));',1)
          old='const priorProduct=(live.products||[]).find((item)=>String(item.id)===String(checkout.productId));\n    priorWeight+=productShippingWeight(priorProduct,checkout.qty);'
          new='const priorProduct=(live.products||[]).find((item)=>String(item.id)===String(checkout.productId));\n    priorWeight+=priorProduct?productShippingWeight(priorProduct,checkout.qty):Math.max(0,Number(checkout.shippingUnitWeightGrams)||0)*Math.max(1,Number(checkout.qty)||1);'
          if old not in s: raise SystemExit('shipping prior product target missing')
          p.write_text(s.replace(old,new,1))

          # Spectator: display games/items above the generated energy buttons.
          for name in ['js/live-energy-spots.js','backend/public/js/live-energy-spots.js']:
              p=Path(name); s=p.read_text()
              old='box.innerHTML="<div><strong>Jeu de l’énergie — choisissez votre spot</strong><p>"+esc(b.productName)+" · "+Number(b.pricePerSpot||0).toFixed(2)+" € / spot</p><div class=\'live-energy-buy-grid\'>"+labels.map(function(label){return "<button type=\'button\' data-buy-energy=\'"+esc(label)+"\'>"+esc(label)+" — "+Number(b.pricePerSpot||0).toFixed(2)+" €</button>";}).join("")+"</div></div>";'
              new='var games=Array.isArray(b.energyGames)?b.energyGames:[],summary=games.map(function(g){var names=(g.items||[]).map(function(x){return x.setName||x.query;}).join(" + ");return "Jeu "+g.number+" : "+names;}).join(" · ");box.innerHTML="<div><strong>Jeu de l’énergie — choisissez votre spot</strong><p>"+(summary?esc(summary)+"<br>":"")+Number(b.pricePerSpot||0).toFixed(2)+" € / spot</p><div class=\'live-energy-buy-grid\'>"+labels.map(function(label){return "<button type=\'button\' data-buy-energy=\'"+esc(label)+"\'>"+esc(label)+" — "+Number(b.pricePerSpot||0).toFixed(2)+" €</button>";}).join("")+"</div></div>";'
              if old not in s: raise SystemExit(f'{name}: spectator energy render target missing')
              p.write_text(s.replace(old,new,1))

          # Keep runtime mirror identical.
          Path('backend/public/js/live-studio-sales-controls.js').write_text(Path('js/live-studio-sales-controls.js').read_text())
          PY

          cat > tests/live-sales-controls-regression.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const read=(p)=>fs.readFileSync(new URL('../'+p,import.meta.url),'utf8');
          const actions=read('backend/lib/live/actions.js'), checkout=read('backend/lib/live/checkout.js'), routes=read('backend/routes/live-actions.js'), adminRoutes=read('backend/routes/live-admin-studio.js'), controls=read('js/live-studio-sales-controls.js'), controlsMirror=read('backend/public/js/live-studio-sales-controls.js'), catalog=read('backend/lib/live/energy-catalog.js'), spectator=read('js/live-energy-spots.js');
          test('energy game does not require a pre-existing sale lot',()=>{assert.match(controls,/function startEnergyGame\(\).*requireLive/);assert.doesNotMatch(controls,/function startEnergyGame\(\).*requireContext/);assert.match(actions,/virtualProduct:true/);assert.match(checkout,/energyBreak/);});
          test('operator chooses 1-10 games or Other and configures each game',()=>{assert.match(controls,/for\(var i=1;i<=10;i\+\+\)/);assert.match(controls,/>Autre</);assert.match(controls,/data-energy-game-type/);assert.match(controls,/Box Break/);assert.match(controls,/Scellé/);assert.match(controls,/À l’unité/);assert.match(controls,/data-energy-game-units/);});
          test('each game carries one or more Pokemon item/set identifiers',()=>{assert.match(controls,/data-energy-game-items/);assert.match(actions,/indique au moins un item \/ une extension Pokémon/);assert.match(actions,/resolveEnergyItems\(items\)/);});
          test('energy categories are resolved from internet catalog data, not guessed from the lot name',()=>{assert.match(catalog,/api\.tcgdex\.net\/v2\/fr/);assert.match(catalog,/sets\/\$\{encodeURIComponent\(set\.id\)\}/);assert.match(catalog,/cards\/\$\{encodeURIComponent\(id\)\}/);assert.match(catalog,/Dresseur \/ Supporter/);assert.match(catalog,/Objet \/ Stade/);assert.match(routes,/energy-catalog\/resolve/);});
          test('EV French shorthand resolves to Scarlet Violet set ids',()=>{assert.match(catalog,/\^ev/);assert.match(catalog,/return"sv"/);});
          test('backend creates unique named spots per game',()=>{assert.match(actions,/`Jeu \$\{i\+1\} — \$\{spot\}`/);assert.match(actions,/spotLabels:labels/);assert.match(checkout,/assertEnergySpotAvailable/);});
          test('energy game route is async for admin and seller',()=>{assert.match(adminRoutes,/await startEnergyGame/);assert.match(routes,/await startEnergyGame/);});
          test('spectator sees game item names and one button per energy spot',()=>{assert.match(spectator,/g\.items/);assert.match(spectator,/data-buy-energy/);assert.match(spectator,/spotLabel:spotLabel/);});
          test('sales controls mirrors remain identical',()=>{assert.equal(controls,controlsMirror);});
          test('social giveaways remain hidden until implemented safely',()=>{assert.match(controls,/follow\.hidden=true/);assert.match(controls,/buyer\.hidden=true/);});
          test('no MutationObserver rerender loop is reintroduced',()=>{assert.doesNotMatch(controls,/new MutationObserver/);assert.match(controls,/setInterval\(decorate,1000\)/);});
          EOF

          node --check backend/lib/live/energy-catalog.js
          node --check backend/lib/live/actions.js
          node --check backend/lib/live/checkout.js
          node --check backend/routes/live-actions.js
          node --check backend/routes/live-admin-studio.js
          node --check js/live-studio-sales-controls.js
          node --test tests/live-sales-controls-regression.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/lib/live/energy-catalog.js backend/lib/live/actions.js backend/lib/live/checkout.js backend/lib/live/shipping.js backend/routes/live-actions.js backend/routes/live-admin-studio.js js/live-studio-sales-controls.js backend/public/js/live-studio-sales-controls.js js/live-energy-spots.js backend/public/js/live-energy-spots.js tests/live-sales-controls-regression.test.mjs
          git commit -m 'feat(live): configure energy games from Pokemon items'
          git push origin HEAD:fix/energy-game-config-no-lot-20260916
