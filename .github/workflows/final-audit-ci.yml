name: Cardoria Final Audit CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  final-audit:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: '10000'
      ADMIN_INITIAL_PASSWORD: 'Cardoria-CI-Only-Password-2026!'
      ADMIN_EMAIL: 'ci-admin@cardoria.invalid'
      CORS_ORIGINS: 'http://127.0.0.1:10000'
      ALERT_EMAIL: 'false'
      MARKETPLACE_DEMO_MODE: 'false'
      LEGACY_ADMIN_CODE: 'false'
      ADMIN_AUTH_DISABLED: 'false'
      BACKUP_INTERVAL_HOURS: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - name: Install and audit
        working-directory: backend
        run: |
          npm install --omit=dev
          npm audit --omit=dev --audit-level=low
      - name: Critical syntax checks
        run: |
          node --check backend/server.js
          node --check backend/lib/security/index.js
          node --check backend/lib/seo/marketplace-sitemap.js
          node --check backend/routes/auth.js
          node --check backend/routes/payments.js
          node --check backend/routes/payments-admin.js
          node --check backend/routes/live.js
          node --check backend/routes/live-admin.js
          node --check backend/lib/payments/sumup.js
          node --check backend/lib/payments/sumup-refund.js
          node --check backend/lib/payments/routing.js
          node --check backend/lib/boutique/checkout.js
          node --check backend/lib/live/checkout.js
          node --check backend/lib/ai/smart-estimate.js
          node --check backend/lib/ai/analyze.js
          node --check backend/lib/market/ingest.js
          node --check backend/lib/market/stats.js
          node --check backend/lib/marketplace/paypal.js
          node --check js/boutique.js
          node --check js/admin/admin-orders.js
          node --check js/client-auth.js
          node --check js/client-password-reset.js
          bash -n oracle/backup.sh
          bash -n oracle/cardoria-ops.sh
      - name: Core regression tests
        run: node --test tests/lot-draft-store.test.mjs tests/catalog-reference-regression.test.mjs backend/tests/market-schedule.test.mjs tests/client-boutique-orders.test.mjs backend/tests/payment-matrix.test.mjs tests/estimation-pricing-reliability.test.mjs tests/ovh-backup-integrity.test.mjs
      # Repository cleanup regression guard: OVH-only deployment and no stale one-shot patch workflows.
      - name: Repository cleanup guards
        run: |
          test ! -e vercel.json
          test ! -e backend/public/vercel.json
          if find .github/workflows -maxdepth 1 -type f \( -name 'patch-live-*-once.yml' -o -name 'patch-live-*-retry.yml' -o -name 'cleanup-live-tests-once.yml' \) | grep -q .; then
            echo "Obsolete one-shot workflow detected"
            exit 1
          fi

      - name: Architecture guards
        run: |
          grep -q 'boutique: "sumup"' backend/lib/payments/routing.js
          grep -q 'live_admin: "sumup"' backend/lib/payments/routing.js
          grep -q 'live_seller: "paypal"' backend/lib/payments/routing.js
          grep -q 'marketplace: "paypal"' backend/lib/payments/routing.js
          grep -q 'refundSumUpTransaction' backend/routes/payments-admin.js
          grep -q 'idempotencyKey' backend/lib/boutique/checkout.js
          grep -q 'syncPaymentFromCheckout(checkoutId)' backend/lib/payments/sumup.js
          grep -q 'retrieveSumUpCheckout(checkoutId)' backend/lib/payments/sumup.js
          if grep -q 'SUMUP_WEBHOOK_SECRET' backend/lib/payments/sumup.js; then echo 'Undocumented SumUp webhook secret dependency found'; exit 1; fi
          grep -q 'const ADMIN_CODE_LOGIN_TEMP_DISABLED = true;' backend/routes/auth.js
          grep -q '/api/auth/login' js/client-auth.js
          grep -q '/api/auth/register' js/client-auth.js
          grep -q '/api/auth/me' js/client-auth.js
          grep -q '/api/auth/logout' js/client-auth.js
          grep -q '/api/auth/password/request' js/client-password-reset.js
          grep -q '/api/auth/password/confirm' js/client-password-reset.js
          grep -q '/reset-password.html' client-login.html
          if grep -q 'live_admin: "revolut"' backend/lib/payments/routing.js; then exit 1; fi
          if grep -R -n 'ADMIN_AUTH_DISABLED.*true' backend 2>/dev/null; then exit 1; fi
      - name: Start backend
        working-directory: backend
        run: |
          node server.js > /tmp/cardoria-final.log 2>&1 &
          echo $! > /tmp/cardoria-final.pid
      - name: Runtime smoke and security boundaries
        run: |
          ready=false
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:10000/api/health/startup > /tmp/startup.json && grep -q '"ready":true' /tmp/startup.json; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = "true"
          curl -fsS http://127.0.0.1:10000/api/health/ | grep -q '"version":"6.0.0"'
          curl -fsS http://127.0.0.1:10000/api/payments/boutique/products | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:10000/api/live/matrix > /tmp/matrix.json
          grep -q '"boutique":"sumup"' /tmp/matrix.json
          grep -q '"live_admin":"sumup"' /tmp/matrix.json
          grep -q '"live_seller":"paypal"' /tmp/matrix.json
          grep -q '"revolut"' /tmp/matrix.json
          if grep -q '"sumup":"retired"' /tmp/matrix.json; then echo "SumUp must not be announced retired"; exit 1; fi
          curl -fsS http://127.0.0.1:10000/api/payments/status > /tmp/payments.json
          grep -q '"provider":"sumup"' /tmp/payments.json
          grep -q '"webhookMode":"api-verification"' /tmp/payments.json
          curl -fsSI -H 'Host: www.cardoriashop.fr' http://127.0.0.1:10000/api/marketplace/v1/sitemap.xml | tr -d '\r' > /tmp/marketplace-sitemap-headers.txt
          grep -qi '^content-type: application/xml' /tmp/marketplace-sitemap-headers.txt
          if grep -qi '^x-robots-tag: .*noindex' /tmp/marketplace-sitemap-headers.txt; then
            echo "Marketplace sitemap must stay crawlable"
            exit 1
          fi
          grep -qi '^x-robots-tag: index, follow' /tmp/marketplace-sitemap-headers.txt
          curl -fsS -H 'Host: www.cardoriashop.fr' http://127.0.0.1:10000/api/marketplace/v1/sitemap.xml > /tmp/marketplace-sitemap.xml
          grep -q '^<?xml version="1.0" encoding="UTF-8"?>' /tmp/marketplace-sitemap.xml
          grep -q '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' /tmp/marketplace-sitemap.xml
          for path in /live-vendeur.html /live-camera.html /marketplace-paiement-succes.html /marketplace-paiement-echec.html; do
            curl -fsSI "http://127.0.0.1:10000${path}" | tr -d '\r' > /tmp/robots-headers.txt
            grep -qi '^x-robots-tag: noindex, nofollow, noarchive$' /tmp/robots-headers.txt
          done
          for path in /api/admin/dashboard /api/admin/users /api/admin/payments/summary /api/admin/marketplace/orders /api/admin/live/sessions /api/system/backups; do
            code=$(curl -sS -o /tmp/anon.json -w '%{http_code}' "http://127.0.0.1:10000${path}")
            test "$code" = "401"
          done
          code=$(curl -sS -o /tmp/retired.json -w '%{http_code}' http://127.0.0.1:10000/api/payments/revolut/checkout)
          test "$code" = "410"
      - name: Client authentication E2E
        run: |
          EMAIL="client-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@cardoria.invalid"
          PASSWORD='ClientTest2026!'
          code=$(curl -sS -o /tmp/register.json -w '%{http_code}' -H 'Content-Type: application/json' -d "{\"name\":\"Client CI\",\"email\":\"${EMAIL}\",\"password\":\"${PASSWORD}\"}" http://127.0.0.1:10000/api/auth/register)
          test "$code" = "201"
          grep -q '"ok":true' /tmp/register.json
          grep -q '"role":"client"' /tmp/register.json
          TOKEN=$(node -e "const d=require('fs').readFileSync('/tmp/register.json','utf8');process.stdout.write(JSON.parse(d).token||'')")
          test -n "$TOKEN"
          code=$(curl -sS -o /tmp/me.json -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" http://127.0.0.1:10000/api/auth/me)
          test "$code" = "200"
          grep -q '"role":"client"' /tmp/me.json
          grep -q "${EMAIL}" /tmp/me.json
          code=$(curl -sS -o /tmp/logout.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer ${TOKEN}" -d '{}' http://127.0.0.1:10000/api/auth/logout)
          test "$code" = "200"
          grep -q '"ok":true' /tmp/logout.json
          code=$(curl -sS -o /tmp/me-after-logout.json -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" http://127.0.0.1:10000/api/auth/me)
          test "$code" = "401"
          code=$(curl -sS -o /tmp/login.json -w '%{http_code}' -H 'Content-Type: application/json' -d "{\"email\":\"${EMAIL}\",\"password\":\"${PASSWORD}\"}" http://127.0.0.1:10000/api/auth/login)
          test "$code" = "200"
          grep -q '"ok":true' /tmp/login.json
          grep -q '"role":"client"' /tmp/login.json
          LOGIN_TOKEN=$(node -e "const d=require('fs').readFileSync('/tmp/login.json','utf8');process.stdout.write(JSON.parse(d).token||'')")
          test -n "$LOGIN_TOKEN"
          code=$(curl -sS -o /tmp/bad-login.json -w '%{http_code}' -H 'Content-Type: application/json' -d "{\"email\":\"${EMAIL}\",\"password\":\"WrongPassword2026!\"}" http://127.0.0.1:10000/api/auth/login)
          test "$code" = "401"
          grep -q 'Email ou mot de passe incorrect' /tmp/bad-login.json
          code=$(curl -sS -o /tmp/reset-unknown.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"unknown-client-ci@cardoria.invalid"}' http://127.0.0.1:10000/api/auth/password/request)
          test "$code" = "200"
          grep -q '"ok":true' /tmp/reset-unknown.json
          grep -q 'Si le compte existe' /tmp/reset-unknown.json
          code=$(curl -sS -o /tmp/reset-invalid.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"token":"invalid-token","password":"NewClient2026!"}' http://127.0.0.1:10000/api/auth/password/confirm)
          test "$code" = "400"
      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/cardoria-final.pid ]; then kill $(cat /tmp/cardoria-final.pid) || true; fi
          if [ -f /tmp/cardoria-final.log ]; then cat /tmp/cardoria-final.log; fi
