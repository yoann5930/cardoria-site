name: Cardoria CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/**"
      - "script.js"
      - "admin-login.html"
      - "admin-email-login.html"
      - "admin.html"
      - "admin-catalogue.html"
      - "admin-references-scelles.html"
      - "js/admin/**"
      - "render.yaml"
      - ".github/workflows/cardoria-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/**"
      - "script.js"
      - "admin-login.html"
      - "admin-email-login.html"
      - "admin.html"
      - "admin-catalogue.html"
      - "admin-references-scelles.html"
      - "js/admin/**"
      - "render.yaml"
      - ".github/workflows/cardoria-ci.yml"

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: 10000
      ADMIN_EMAIL: Cardoria59330@gmail.com
      ADMIN_INITIAL_PASSWORD: Cardoria-CI-Temporary-Password-2026!
      LEGACY_ADMIN_CODE: "false"
      ADMIN_AUTH_DISABLED: "false"
      CORS_ORIGINS: http://127.0.0.1:10000
      ALERT_EMAIL: "false"
      CSRF_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          package-manager-cache: false
      - name: Install backend dependencies
        run: npm install --omit=dev
      - name: Syntax checks
        run: |
          node --check server.js
          node --check routes/auth.js
          node --check routes/admin.js
          node --check routes/engine-admin.js
          node --check lib/auth.js
          node --check lib/auth/migrate.js
          node --check lib/auth/magicLink.js
          node --check lib/email.js
          node --check lib/engine/tcgdex-sync.js
          node --check lib/engine/market-schedule.js
          node --check lib/engine/sealed-products.js
          node --check ../script.js
          node --check ../js/admin/admin-login-secure.js
          node --check ../js/admin/admin-email-login.js
          node --check ../js/admin/admin-lot-draft-store.js
          node --check ../js/admin/admin-catalog-purchase-link.js
          node --check ../js/admin/admin-purchases-catalog-link.js
          node --check ../js/admin/admin-catalog-sealed-shortcuts.js
          node --check ../js/admin/admin-sealed-references.js
      - name: Lot market and catalog regression tests
        working-directory: .
        run: node --test tests/lot-draft-store.test.mjs tests/catalog-reference-regression.test.mjs backend/tests/market-schedule.test.mjs
      - name: Reject client-side admin bypass
        working-directory: .
        run: |
          if grep -R -n 'ADMIN_CODE_LOCAL="CARDORIA59330"\|const ADMIN_CODE_LOCAL="CARDORIA59330"' script.js js *.html 2>/dev/null; then
            echo "Client-side admin bypass detected"
            exit 1
          fi
          if grep -R -n 'ADMIN_AUTH_DISABLED.*true' backend render.yaml 2>/dev/null; then
            echo "Direct admin bypass must never be enabled"
            exit 1
          fi
          if git grep -I -nE 'SMTP_PASS[[:space:]]*=[[:space:]]*[^[:space:]#]+' -- . ':!.github/workflows' ':!backend/node_modules' ':!**/node_modules/**'; then
            echo "Hardcoded SMTP_PASS detected"
            exit 1
          fi
          if git grep -I -nE 'SMTP_PASS[[:space:]]*:[[:space:]]*["'\''][^"'\'']+' -- . ':!.github/workflows' ':!backend/node_modules' ':!**/node_modules/**'; then
            echo "Hardcoded SMTP_PASS detected"
            exit 1
          fi
          if grep -A2 -- '- key: SMTP_PASS' render.yaml | grep -q 'value:'; then
            echo "SMTP_PASS must not have a plaintext value in render.yaml"
            exit 1
          fi
          if ! grep -A2 -- '- key: SMTP_PASS' render.yaml | grep -q 'sync: false'; then
            echo "SMTP_PASS must be a Render secret (sync: false)"
            exit 1
          fi
          if ! grep -q 'requireTLS: !secure && port === 587' backend/lib/email.js; then
            echo "Gmail STARTTLS on port 587 is missing"
            exit 1
          fi
      - name: Start backend
        run: |
          npm start > /tmp/cardoria-backend.log 2>&1 &
          echo $! > /tmp/cardoria-backend.pid
      - name: Wait for complete startup
        run: |
          ready=false
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:10000/api/health/startup >/tmp/cardoria-startup.json; then
              if grep -q '"ready":true' /tmp/cardoria-startup.json; then
                cat /tmp/cardoria-startup.json
                ready=true
                break
              fi
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            cat /tmp/cardoria-startup.json || true
            cat /tmp/cardoria-backend.log || true
            exit 1
          fi
      - name: Verify admin login page
        run: |
          curl -fsS http://127.0.0.1:10000/admin-login.html | grep -q "Admin Cardoria"
          curl -fsS http://127.0.0.1:10000/admin-login.html | grep -q "adminLoginForm\|adminEmailLoginForm"
      - name: Verify magic-link endpoint is public and neutral
        run: |
          code=$(curl -sS -o /tmp/magic-link.json -w "%{http_code}" -X POST http://127.0.0.1:10000/api/auth/request-magic-link -H 'content-type: application/json' --data '{"email":"unknown@example.com"}')
          test "$code" = "200"
          grep -q '"ok":true' /tmp/magic-link.json
      - name: Verify SMTP test route is protected and detects missing config
        working-directory: .
        run: |
          code=$(curl -sS -o /tmp/email-test-anon.json -w "%{http_code}" http://127.0.0.1:10000/api/admin/email/test)
          test "$code" = "401"
          grep -q 'router.use(requireAdmin)' backend/routes/email-admin.js
          grep -q 'res.status(503)' backend/routes/email-admin.js
          grep -q 'isSmtpConfigured()' backend/routes/email-admin.js
      - name: Verify protected admin endpoint rejects anonymous access
        run: |
          code=$(curl -sS -o /tmp/admin-anon.json -w "%{http_code}" http://127.0.0.1:10000/api/admin/engine/licenses)
          test "$code" = "401"
      - name: Backend log on failure
        if: failure()
        run: cat /tmp/cardoria-backend.log || true
      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/cardoria-backend.pid ]; then kill $(cat /tmp/cardoria-backend.pid) || true; fi
