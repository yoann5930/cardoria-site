name: Live Camera Production Smoke

on:
  push:
    branches:
      - diag/live-camera-production-20260911

permissions:
  contents: read

jobs:
  camera-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public Live page
        run: |
          set -euo pipefail
          curl -fsS --retry 2 --connect-timeout 10 https://cardoriashop.fr/live.html -o /tmp/live.html
          grep -q 'cardoria-live-publisher.js' /tmp/live.html
          grep -q 'cardoria-live-viewer.js' /tmp/live.html
      - name: Check WebRTC production configuration
        run: |
          set -euo pipefail
          body=$(curl -fsS --retry 2 --connect-timeout 10 https://cardoriashop.fr/api/live/webrtc/status)
          printf '%s\n' "$body"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.ok!==true) process.exit(2); if(x.provider!=="cloudflare-realtime") process.exit(3); if(x.configured!==true){console.error("CLOUDFLARE_REALTIME_NOT_CONFIGURED"); process.exit(4)}' "$body"
      - name: Check camera pairing page and publisher client
        run: |
          set -euo pipefail
          curl -fsS --retry 2 --connect-timeout 10 https://cardoriashop.fr/live-camera.html -o /tmp/camera.html
          curl -fsS --retry 2 --connect-timeout 10 https://cardoriashop.fr/js/cardoria-live-publisher.js -o /tmp/publisher.js
          grep -q 'Démarrer la caméra 2' /tmp/camera.html
          grep -q 'getUserMedia' /tmp/publisher.js
          grep -q '/api/live/webrtc/publisher/start' /tmp/publisher.js
