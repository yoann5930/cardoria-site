name: Revolut purchase smoke test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/revolut-purchase-smoke.yml"
      - "backend/routes/payments.js"
      - "backend/routes/payments-admin.js"
      - "backend/lib/payments/revolut.js"
      - "backend/lib/boutique/checkout.js"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/revolut-purchase-smoke.yml"
      - "backend/routes/payments.js"
      - "backend/routes/payments-admin.js"
      - "backend/lib/payments/revolut.js"
      - "backend/lib/boutique/checkout.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revolut-purchase-smoke-main
  cancel-in-progress: true

jobs:
  revolut-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record Revolut status without creating an order
        shell: bash
        run: |
          set -euo pipefail
          STATUS_FILE="${RUNNER_TEMP}/revolut-status.json"
          PRODUCTS_FILE="${RUNNER_TEMP}/revolut-products.json"
          RESULT_FILE="${RUNNER_TEMP}/revolut-smoke-result.json"

          curl --fail --silent --show-error --retry 3 --retry-delay 3 \
            --output "$STATUS_FILE" \
            https://www.cardoriashop.fr/api/payments/status

          curl --fail --silent --show-error --retry 3 --retry-delay 3 \
            --output "$PRODUCTS_FILE" \
            https://www.cardoriashop.fr/api/payments/boutique/products

          STATUS_FILE="$STATUS_FILE" PRODUCTS_FILE="$PRODUCTS_FILE" RESULT_FILE="$RESULT_FILE" node <<'NODE'
          const fs = require("node:fs");
          const status = JSON.parse(fs.readFileSync(process.env.STATUS_FILE, "utf8"));
          const productsPayload = JSON.parse(fs.readFileSync(process.env.PRODUCTS_FILE, "utf8"));
          const provider = String(status.provider || "");
          const environment = String(status.environment || "").trim().toLowerCase();
          const configured = Boolean(status.configured);
          if (provider !== "revolut") {
            throw new Error("Provider inattendu: " + provider);
          }
          if (environment !== "sandbox" && environment !== "production") {
            throw new Error("Environment inattendu: " + environment);
          }
          const products = Array.isArray(productsPayload.products) ? productsPayload.products : [];
          const product = products
            .filter((item) => item && item.purchasable && Number(item.stock) > 0 && Number(item.price) > 0)
            .sort((a, b) => Number(a.price) - Number(b.price))[0] || null;
          let conclusion = "🔴 REVOLUT PROD NON CONFIGURÉ";
          let error = "REVOLUT_SECRET_KEY manquante dans /etc/cardoria/cardoria.env sur OVH";
          if (configured && environment === "production") {
            conclusion = "🟢 REVOLUT PROD CONFIGURÉ";
            error = "Smoke lecture seule: aucun checkout réel n’est lancé.";
          } else if (configured && environment === "sandbox") {
            conclusion = "🟠 REVOLUT CONFIGURÉ MAIS EN SANDBOX";
            error = "Smoke lecture seule: aucun checkout réel n’est lancé.";
          }
          const result = {
            testedAt: new Date().toISOString(),
            provider,
            environment,
            configured,
            product: product ? { id: String(product.id || ""), name: String(product.name || ""), price: Number(product.price || 0) } : null,
            productAvailable: Boolean(product),
            httpStatus: 200,
            checkoutCreated: false,
            orderId: "",
            providerOrderId: "",
            conclusion,
            error
          };
          fs.writeFileSync(process.env.RESULT_FILE, JSON.stringify(result, null, 2) + "\n");
          console.log(JSON.stringify(result, null, 2));
          NODE

          {
            echo "## Revolut purchase smoke"
            echo
            echo "- testedAt: \`$(node -e 'const r=require(process.argv[1]); process.stdout.write(r.testedAt)' "$RESULT_FILE")\`"
            echo "- provider: \`$(node -e 'const r=require(process.argv[1]); process.stdout.write(r.provider)' "$RESULT_FILE")\`"
            echo "- environment: \`$(node -e 'const r=require(process.argv[1]); process.stdout.write(r.environment)' "$RESULT_FILE")\`"
            echo "- configured: \`$(node -e 'const r=require(process.argv[1]); process.stdout.write(String(r.configured))' "$RESULT_FILE")\`"
            echo "- checkoutCreated: \`false\`"
            echo "- orderId: \`\`"
            echo "- providerOrderId: \`\`"
            echo "- product: \`$(node -e 'const r=require(process.argv[1]); process.stdout.write(r.product ? r.product.id + " / " + r.product.name : "aucun produit achetable lu")' "$RESULT_FILE")\`"
            echo
            echo "$(node -e 'const r=require(process.argv[1]); process.stdout.write(r.conclusion)' "$RESULT_FILE")"
            echo
            echo "Aucun POST, checkout, commande, paiement ou écriture Git."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke report artifact
        uses: actions/upload-artifact@v4
        with:
          name: revolut-smoke-result
          path: ${{ runner.temp }}/revolut-smoke-result.json
          if-no-files-found: error
          retention-days: 14
