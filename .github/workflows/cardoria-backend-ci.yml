name: Cardoria Backend CI

on:
  push:
    branches:
      - main
      - fix/cardoria-production-stability
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Syntax check
        run: node --check server.js

      - name: Start backend
        env:
          NODE_ENV: test
          PORT: '10000'
          LEGACY_ADMIN_CODE: 'false'
          ADMIN_INITIAL_PASSWORD: 'Cardoria-CI-Only-Password-2026!'
          ADMIN_EMAIL: 'ci-admin@cardoria.invalid'
          ALERT_EMAIL: 'false'
        run: |
          node server.js > /tmp/cardoria-backend.log 2>&1 &
          echo $! > /tmp/cardoria-backend.pid

      - name: Health check
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:10000/api/health/ > /tmp/cardoria-health.json; then
              cat /tmp/cardoria-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cardoria-backend.log || true
          exit 1

      - name: Startup health
        run: |
          curl --fail --silent http://127.0.0.1:10000/api/health/startup || true

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/cardoria-backend.pid ]; then
            kill $(cat /tmp/cardoria-backend.pid) || true
          fi
          cat /tmp/cardoria-backend.log || true
