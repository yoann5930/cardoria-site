name: OVH Redeploy Main Once 20260917

on:
  push:
    branches:
      - ops/redeploy-main-ovh-20260917

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/ovh-ops-run.yml
    with:
      action: deploy
      branch: main
    secrets: inherit
  healthcheck:
    needs: deploy
    uses: ./.github/workflows/ovh-ops-run.yml
    with:
      action: healthcheck
      branch: main
    secrets: inherit
  report:
    needs: healthcheck
    uses: ./.github/workflows/ovh-ops-run.yml
    with:
      action: report
      branch: main
    secrets: inherit
