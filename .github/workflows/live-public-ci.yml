name: Cardoria Live Public CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/server.js"
      - "backend/routes/live.js"
      - "backend/routes/live-realtime.js"
      - "backend/routes/live-actions.js"
      - "backend/lib/live/**"
      - "backend/lib/security/index.js"
      - "backend/scripts/live-public-e2e.mjs"
      - "backend/tests/live-scheduling.test.mjs"
      - "js/cardoria-live-viewer.js"
      - "js/cardoria-live-actions.js"
      - "js/client-auth.js"
      - "js/admin/admin-live.js"
      - "client-login.html"
      - "admin-live.html"
      - "backend/public/js/cardoria-live-viewer.js"
      - "backend/public/js/cardoria-live-actions.js"
      - "backend/public/js/client-auth.js"
      - "backend/public/js/admin/admin-live.js"
      - "backend/public/client-login.html"
      - "live.html"
      - "backend/public/live.html"
      - "tests/live-public-journey-browser.mjs"
      - ".github/workflows/live-public-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/server.js"
      - "backend/routes/live.js"
      - "backend/routes/live-realtime.js"
      - "backend/routes/live-actions.js"
      - "backend/lib/live/**"
      - "backend/lib/security/index.js"
      - "backend/scripts/live-public-e2e.mjs"
      - "backend/tests/live-scheduling.test.mjs"
      - "js/cardoria-live-viewer.js"
      - "js/cardoria-live-actions.js"
      - "js/client-auth.js"
      - "js/admin/admin-live.js"
      - "client-login.html"
      - "admin-live.html"
      - "backend/public/js/cardoria-live-viewer.js"
      - "backend/public/js/cardoria-live-actions.js"
      - "backend/public/js/client-auth.js"
      - "backend/public/js/admin/admin-live.js"
      - "backend/public/client-login.html"
      - "live.html"
      - "backend/public/live.html"
      - "tests/live-public-journey-browser.mjs"
      - ".github/workflows/live-public-ci.yml"

permissions:
  contents: read

jobs:
  live-public-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      PORT: 10000
      CORS_ORIGINS: http://127.0.0.1:10000
      ALERT_EMAIL: "false"
      MARKETPLACE_DEMO_MODE: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          package-manager-cache: false
      - name: Install backend
        working-directory: backend
        run: npm install --omit=dev
      - name: Live public syntax checks
        run: |
          node --check backend/server.js
          node --check backend/routes/live.js
          node --check backend/routes/live-realtime.js
          node --check backend/routes/live-actions.js
          node --check backend/scripts/live-public-e2e.mjs
          node --check js/cardoria-live-actions.js
          node --check js/client-auth.js
      - name: Public Live security guards
        run: |
          grep -q 'session?.status === "live"' backend/routes/live.js
          grep -q 'live.status!=="live"' backend/routes/live-realtime.js
          grep -q 'assertPublicLive' backend/routes/live-actions.js
          grep -q 'sanitizePublicValue' backend/routes/live.js
          grep -q 'promoteScheduledLives' backend/server.js
          grep -q 'setInterval(promoteScheduledLives' backend/server.js
          grep -q 'live-chat-dock' live.html
          grep -q 'id="claChatDock"' live.html
          grep -q 'Lives programmés' live.html
          grep -q 'cardoriaLiveScheduledDirectory' live.html
          grep -q 'cardoriaLiveCategoryFilter' live.html
          grep -q 'data-live-directory-only' live.html
          grep -q 'data-live-room-only' live.html
          grep -q 'if(!focus)return' js/cardoria-live-actions.js
          grep -q 'location.assign(`/live.html?session=' js/cardoria-live-viewer.js
          grep -q 'planId: plan.planId' backend/routes/live.js
          grep -q 'Elite' backend/lib/live/public-directory.js
          grep -q 'CLIENT_LOGIN_REQUIRED' backend/routes/live-actions.js
          grep -q 'cardoria_account' js/cardoria-live-actions.js
          ! grep -q 'id="claName"' js/cardoria-live-actions.js
          ! grep -q 'placeholder="Votre nom"' js/cardoria-live-actions.js
          ! grep -q 'cardoria-live-admin-studio.js' live.html
          ! grep -q 'cardoria_admin_handoff_token' live.html
          grep -q 'Live en cours — en attente de diffusion' live.html
          grep -Eq 'waiting:[[:space:]]*!sources.length' backend/lib/live/realtime-sessions.js
          grep -q 'cardoria-live-actions.js?v=20260923-live-split' live.html
          grep -q 'cardoria-live-viewer.js?v=20260926-live-ice-answer' live.html
          grep -q 'client-auth.js?v=20260923-live-public-journey' client-login.html
          grep -q 'ALWAYS_REVALIDATE_PUBLIC_PATHS' backend/server.js
      - name: Start clean backend
        working-directory: backend
        run: |
          rm -rf data
          node server.js > /tmp/cardoria-live-public.log 2>&1 &
          echo $! > /tmp/cardoria-live-public.pid
      - name: Wait for backend
        run: |
          ready=false
          for i in {1..90}; do
            if curl --fail --silent http://127.0.0.1:10000/api/health/startup > /tmp/cardoria-live-public-startup.json; then
              if grep -q '"ready":true' /tmp/cardoria-live-public-startup.json; then ready=true; break; fi
            fi
            sleep 1
          done
          test "$ready" = "true"
      - name: Live public cache freshness
        run: |
          set -euo pipefail
          curl -sSI http://127.0.0.1:10000/live.html | tr -d "\r" | grep -qi '^cache-control: .*no-store'
          curl -sSI http://127.0.0.1:10000/js/cardoria-live-actions.js | tr -d "\r" | grep -qi '^cache-control: .*no-store'
          curl -sSI http://127.0.0.1:10000/js/cardoria-live-viewer.js | tr -d "\r" | grep -qi '^cache-control: .*no-store'
          curl -sSI http://127.0.0.1:10000/client-login.html | tr -d "\r" | grep -qi '^x-frame-options: *sameorigin'
          curl -fsS http://127.0.0.1:10000/live.html | grep -q 'cardoria-live-actions.js?v=20260923-live-split'
          curl -fsS http://127.0.0.1:10000/live.html | grep -q 'cardoriaLiveCategoryFilter'
          curl -fsS http://127.0.0.1:10000/live.html | grep -q 'Lives programmés'
          curl -fsS http://127.0.0.1:10000/live.html | grep -q 'Live en cours — en attente de diffusion'
          ! curl -fsS http://127.0.0.1:10000/live.html | grep -q 'cardoria-live-admin-studio.js'
          curl -fsS http://127.0.0.1:10000/js/cardoria-live-actions.js | grep -q 'live-chat-dock'
          ! curl -fsS http://127.0.0.1:10000/js/cardoria-live-actions.js | grep -q 'id="claName"'
      - name: Live public visibility privacy and viewer E2E
        working-directory: backend
        run: node scripts/live-public-e2e.mjs
      - name: Existing Live realtime regression
        run: |
          node --test backend/tests/live-realtime-contract.test.mjs
          node --test backend/tests/live-architecture.test.mjs
          node --test backend/tests/live-scheduling.test.mjs
          node --test backend/tests/live-camera.test.mjs
          node --test backend/tests/live-admin-embedded-studio.test.mjs
          node --test backend/tests/live-public-directory.test.mjs
          node --test backend/tests/live-public-cleanup.test.mjs
      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/cardoria-live-public.pid ]; then kill $(cat /tmp/cardoria-live-public.pid) || true; fi
          cat /tmp/cardoria-live-public.log || true

  live-public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      ALERT_EMAIL: "false"
      MARKETPLACE_DEMO_MODE: "false"
      ADMIN_REQUIRE_2FA: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          package-manager-cache: false
      - name: Install backend
        working-directory: backend
        run: npm install --omit=dev
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real Admin to public Live browser journey
        run: node tests/live-public-journey-browser.mjs
