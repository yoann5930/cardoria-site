name: SEO sitemap dates CI

on:
  pull_request:
    paths:
      - backend/lib/seo/sitemap.js
      - tests/seo-sitemap-lastmod.test.mjs
      - .github/workflows/seo-sitemap-lastmod-ci.yml

permissions:
  contents: read

jobs:
  seo-sitemap-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.node-version
      - name: Check production module syntax
        run: node --check backend/lib/seo/sitemap.js
      - name: Test sitemap dates, partitioning and public URLs
        run: node --experimental-vm-modules --test tests/seo-sitemap-lastmod.test.mjs
