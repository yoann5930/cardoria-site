<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Catalogue de référence — Cardoria Enterprise</title>
<link rel="stylesheet" href="/style.css?v=20260901-1">
<link rel="stylesheet" href="/css/admin.css?v=20260901-1">
<link rel="icon" href="/assets/logo/cardoria-premium.png">
<style>
#catalogFallback{min-height:100vh;background:#06080d;color:#fff8e8;padding:32px;font-family:Arial,sans-serif}
#catalogFallback .box{max-width:760px;margin:60px auto;padding:24px;border:1px solid rgba(212,175,55,.3);border-radius:18px;background:#0b0e14}
#catalogFallback h1{color:#ffe18a;margin-top:0}
</style>
</head>
<body>
<div id="catalogFallback">
  <div class="box">
    <h1>Catalogue de référence Cardoria</h1>
    <p>Chargement de l’administration…</p>
    <p id="catalogFallbackStatus" style="color:#baaf97">Si cet écran reste affiché, le script d’administration n’a pas démarré.</p>
    <button type="button" onclick="location.reload(true)" style="padding:10px 16px;border-radius:10px;border:1px solid #d4af37;background:#17130a;color:#ffe18a;font-weight:700;cursor:pointer">Recharger</button>
  </div>
</div>
<script>
window.addEventListener('error', function (event) {
  var el = document.getElementById('catalogFallbackStatus');
  if (el) el.textContent = 'Erreur JavaScript : ' + (event.message || 'erreur inconnue');
});
window.addEventListener('unhandledrejection', function () {
  var el = document.getElementById('catalogFallbackStatus');
  if (el) el.textContent = 'Erreur pendant le chargement des données. Recharge la page.';
});
</script>
<script src="/js/admin/admin-core.js?v=20260901-1"></script>
<script src="/js/admin/admin-lot-draft-store.js?v=20260901-1"></script>
<script src="/js/admin/admin-catalog-languages.js?v=20260901-1"></script>
<script src="/js/admin/admin-catalog.js?v=20260901-1"></script>
<script src="/js/admin/admin-catalog-recovery.js?v=20260901-1"></script>
<script src="/js/admin/admin-catalog-sealed-shortcuts.js?v=20260901-1"></script>
<script src="/js/admin/admin-catalog-enhance.js?v=20260901-1"></script>
<script src="/js/admin/admin-catalog-purchase-link.js?v=20260901-1"></script>
<script>
setTimeout(function () {
  var fallback = document.getElementById('catalogFallback');
  if (fallback && window.CardoriaAdmin) {
    var status = document.getElementById('catalogFallbackStatus');
    if (status) status.textContent = 'Le noyau admin est chargé, mais le catalogue ne s’est pas initialisé.';
  }
}, 4000);
</script>
</body>
</html>
