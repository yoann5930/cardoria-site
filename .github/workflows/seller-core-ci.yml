name: Cardoria Seller Core CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  seller-core-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: '10000'
      CORS_ORIGINS: 'http://127.0.0.1:10000'
      ALERT_EMAIL: 'false'
      MARKETPLACE_DEMO_MODE: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - name: Install backend
        run: npm install --omit=dev
      - name: Seller core syntax checks
        run: |
          node --check server.js
          node --check routes/marketplace-v1.js
          node --check lib/marketplace/sellers.js
          node --check lib/marketplace/orders.js
          node --check lib/marketplace/v1/security.js
          node --check lib/subscriptions/seller-plans.js
          node --check scripts/seller-core-e2e.mjs
      - name: Seller fulfillment guards
        working-directory: .
        run: |
          grep -q 'assertSellerFulfillmentTransition' backend/routes/marketplace-v1.js
          grep -q 'La commande doit etre payee' backend/routes/marketplace-v1.js
          grep -q 'Transition vendeur invalide' backend/routes/marketplace-v1.js
      - name: Start clean backend
        run: |
          rm -rf data
          node server.js > /tmp/cardoria-seller-core.log 2>&1 &
          echo $! > /tmp/cardoria-seller-core.pid
      - name: Wait for backend
        run: |
          ready=false
          for i in {1..90}; do
            if curl --fail --silent http://127.0.0.1:10000/api/health/startup > /tmp/cardoria-seller-core-startup.json; then
              if grep -q '"ready":true' /tmp/cardoria-seller-core-startup.json; then ready=true; break; fi
            fi
            sleep 1
          done
          test "$ready" = "true"
      - name: Seller ownership subscription and fulfillment E2E
        run: node scripts/seller-core-e2e.mjs
      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/cardoria-seller-core.pid ]; then kill $(cat /tmp/cardoria-seller-core.pid) || true; fi
          cat /tmp/cardoria-seller-core.log || true
