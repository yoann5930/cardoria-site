name: OVH Ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: Allowlisted VPS operation
        required: true
        type: choice
        options:
          - status
          - healthcheck
          - deploy
          - restart
          - backup
          - nginx-test
          - logs
          - rollback
          - report
          - backup-check
          - dns-check
          - https-enable
      branch:
        description: Production deploy branch
        required: false
        type: choice
        default: main
        options:
          - main

permissions:
  contents: read

concurrency:
  group: ovh-ops-dispatch
  cancel-in-progress: false

jobs:
  ovh-ops:
    uses: ./.github/workflows/ovh-ops-run.yml
    with:
      action: ${{ inputs.action }}
      branch: main
    secrets: inherit
