name: Cardoria Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  production-check:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: '10000'
      LEGACY_ADMIN_CODE: 'false'
      ADMIN_AUTH_DISABLED: 'false'
      ADMIN_INITIAL_PASSWORD: 'Cardoria-CI-Only-Password-2026!'
      ADMIN_EMAIL: 'ci-admin@cardoria.invalid'
      CORS_ORIGINS: 'http://127.0.0.1:10000'
      ALERT_EMAIL: 'false'
      MARKETPLACE_DEMO_MODE: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - name: Install and security audit
        working-directory: backend
        run: |
          npm install --omit=dev
          npm audit --omit=dev --audit-level=low
      - name: Syntax checks
        run: |
          node --check backend/server.js
          node --check backend/routes/payments.js
          node --check backend/routes/payments-admin.js
          node --check backend/routes/live.js
          node --check backend/routes/live-admin.js
          node --check backend/lib/payments/routing.js
          node --check backend/lib/payments/sumup.js
          node --check backend/lib/payments/sumup-refund.js
          node --check backend/lib/boutique/checkout.js
          node --check backend/lib/live/checkout.js
          node --check backend/lib/live/sessions.js
          node --check backend/lib/live/camera-media.js
          node --check backend/lib/security/index.js
          node --check js/boutique.js
          node --check js/admin/admin-orders.js
          node --check js/admin/admin-payments.js
      - name: Payment matrix and idempotence tests
        run: node --test backend/tests/payment-matrix.test.mjs
      - name: Live camera permission tests
        run: node --test backend/tests/live-camera.test.mjs
      - name: SumUp Boutique and Live Admin wiring
        run: |
          grep -q 'boutique: "sumup"' backend/lib/payments/routing.js
          grep -q 'live_admin: "sumup"' backend/lib/payments/routing.js
          grep -q 'live_seller: "paypal"' backend/lib/payments/routing.js
          grep -q 'marketplace: "paypal"' backend/lib/payments/routing.js
          grep -q 'createSumUpCheckout' backend/lib/boutique/checkout.js
          grep -q 'idempotencyKey' backend/lib/boutique/checkout.js
          grep -q 'createSumUpCheckout' backend/lib/live/checkout.js
          grep -q 'refundSumUpTransaction' backend/routes/payments-admin.js
          grep -q 'sumup_admin_sync' backend/routes/payments-admin.js
          grep -q 'sumup_admin_refund' backend/routes/payments-admin.js
          grep -q 'SUMUP_WEBHOOK_SECRET obligatoire en production' backend/lib/payments/sumup.js
          grep -q 'provider:"sumup"' js/boutique.js
          if grep -q 'live_admin: "revolut"' backend/lib/payments/routing.js; then exit 1; fi
      - name: Security regression guards
        run: |
          grep -q 'const ADMIN_CODE_LOGIN_TEMP_DISABLED = true;' backend/routes/auth.js
          if grep -R -n 'ADMIN_AUTH_DISABLED.*true' backend 2>/dev/null; then exit 1; fi
          if git grep -I -nE 'SMTP_PASS[[:space:]]*=[[:space:]]*[^[:space:]#]+' -- . ':!.github/workflows' ':!backend/node_modules'; then exit 1; fi
      - name: Start backend
        working-directory: backend
        run: |
          node server.js > /tmp/cardoria-backend.log 2>&1 &
          echo $! > /tmp/cardoria-backend.pid
      - name: Runtime health and payment matrix
        run: |
          ready=false
          for i in {1..90}; do
            if curl --fail --silent http://127.0.0.1:10000/api/health/startup > /tmp/startup.json && grep -q '"ready":true' /tmp/startup.json; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = "true"
          curl --fail --silent http://127.0.0.1:10000/api/health/ > /tmp/health.json
          grep -q '"version":"6.0.0"' /tmp/health.json
          curl --fail --silent http://127.0.0.1:10000/api/live/matrix > /tmp/matrix.json
          grep -q '"boutique":"sumup"' /tmp/matrix.json
          grep -q '"live_admin":"sumup"' /tmp/matrix.json
          grep -q '"live_seller":"paypal"' /tmp/matrix.json
          if grep -q '"sumup":"retired"' /tmp/matrix.json; then echo "SumUp must not be announced retired"; exit 1; fi
          curl -sSI http://127.0.0.1:10000/admin-live.html > /tmp/headers.txt
          grep -qi 'permissions-policy:' /tmp/headers.txt
          grep -qi 'camera=(self)' /tmp/headers.txt
          grep -qi 'microphone=(self)' /tmp/headers.txt
          if grep -Eiq 'camera=\(\)[[:space:],]' /tmp/headers.txt; then echo 'Permissions-Policy still disables camera'; exit 1; fi
          curl --fail --silent http://127.0.0.1:10000/api/payments/status > /tmp/payments.json
          grep -q '"provider":"sumup"' /tmp/payments.json
          code=$(curl -sS -o /tmp/admin.json -w "%{http_code}" http://127.0.0.1:10000/api/admin/payments/summary)
          test "$code" = "401"
      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/cardoria-backend.pid ]; then kill $(cat /tmp/cardoria-backend.pid) || true; fi
          if [ -f /tmp/cardoria-backend.log ]; then cat /tmp/cardoria-backend.log; fi
