name: Cardoria Home Navigation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  home-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Home navigation regression tests
        run: node --test tests/home-navigation.test.mjs tests/seo-canonical-navigation.test.mjs
      - name: Validate primary production routes
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            /
            /boutique.html
            /marketplace.html
            /estimation.html
            /live.html
            /client-login.html
            /pages/contact/
            /admin-login.html
          )
          for route in "${routes[@]}"; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://www.cardoriashop.fr${route}")
            echo "${route} => ${code}"
            case "${code}" in
              200|204) ;;
              *) echo "Route production invalide: ${route} (${code})"; exit 1 ;;
            esac
          done
