name: OVH Backup Prune Issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: ovh-backup-prune
  cancel-in-progress: false

jobs:
  prune:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'ovh-backup-prune:') &&
      contains(github.event.issue.labels.*.name, 'ovh-ops:deploy') &&
      contains(github.event.issue.labels.*.name, 'ovh-branch:main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OVH_VPS_HOST: ${{ secrets.OVH_VPS_HOST }}
      OVH_VPS_USER: ${{ secrets.OVH_VPS_USER }}
      OVH_VPS_SSH_KEY: ${{ secrets.OVH_VPS_SSH_KEY }}
      OVH_VPS_HOST_FINGERPRINT: ${{ secrets.OVH_VPS_HOST_FINGERPRINT }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "${OVH_VPS_HOST:-}"
          test -n "${OVH_VPS_USER:-}"
          test -n "${OVH_VPS_SSH_KEY:-}"
          test -n "${OVH_VPS_HOST_FINGERPRINT:-}"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$OVH_VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -t ed25519 -T 10 "$OVH_VPS_HOST" > "$HOME/.ssh/known_hosts"
          got=$(ssh-keygen -lf "$HOME/.ssh/known_hosts" | awk '{print $2}')
          expected=$(printf '%s' "$OVH_VPS_HOST_FINGERPRINT" | tr -d '\r\n')
          test "$got" = "$expected"

      - name: Prune only known Cardoria backup artifacts
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o PreferredAuthentications=publickey -o ConnectTimeout=15 "${OVH_VPS_USER}@${OVH_VPS_HOST}" 'sudo python3 -' <<'PY'
          import os
          import re
          from collections import defaultdict

          root = "/opt/cardoria/backups"
          pattern = re.compile(r"^cardoria-(postgres|data)-(\d{8}T\d{6}Z)\.(dump|tar\.gz)$")
          groups = defaultdict(dict)

          for name in os.listdir(root):
              match = pattern.match(name)
              if not match:
                  continue
              kind, stamp, _ext = match.groups()
              groups[stamp][kind] = os.path.join(root, name)

          complete = sorted(
              (stamp for stamp, files in groups.items() if {"postgres", "data"} <= files.keys()),
              reverse=True,
          )
          keep = set(complete[:12])
          seen_days = set()
          for stamp in complete:
              day = stamp[:8]
              if day not in seen_days and len(seen_days) < 7:
                  keep.add(stamp)
                  seen_days.add(day)

          removed = 0
          for stamp, files in groups.items():
              if stamp in keep:
                  continue
              for path in files.values():
                  os.remove(path)
                  removed += 1

          print("complete_sets_before:", len(complete))
          print("kept_sets:", len(keep))
          print("files_removed:", removed)
          PY

          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o PreferredAuthentications=publickey -o ConnectTimeout=15 "${OVH_VPS_USER}@${OVH_VPS_HOST}" 'df -hT /; du -sh /opt/cardoria/backups 2>/dev/null || true'

      - name: Close request
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --comment "Nettoyage sécurisé des anciennes sauvegardes terminé."
