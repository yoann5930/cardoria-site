name: OVH Backup Prune Issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: ovh-backup-prune
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'ovh-backup-prune:') &&
      contains(github.event.issue.labels.*.name, 'ovh-ops:deploy') &&
      contains(github.event.issue.labels.*.name, 'ovh-branch:main')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Authorized owner-only OVH backup prune request."

  prune:
    needs: authorize
    uses: ./.github/workflows/ovh-ops-run.yml
    with:
      action: backup-prune
      branch: main
    secrets: inherit

  status:
    needs: prune
    uses: ./.github/workflows/ovh-ops-run.yml
    with:
      action: status
      branch: main
    secrets: inherit

  close:
    needs: status
    runs-on: ubuntu-latest
    steps:
      - name: Close prune request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --comment "Nettoyage sécurisé des anciennes sauvegardes terminé et espace disque contrôlé."
