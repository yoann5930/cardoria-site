services:
  - type: web
    name: cardoria-site-2
    runtime: node
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health/
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: LEGACY_ADMIN_CODE
        value: "false"
      - key: SITE_URL
        value: https://cardoria.fr
      - key: CORS_ORIGINS
        value: https://cardoria.fr,https://www.cardoria.fr,https://cardoria.vercel.app
    disk:
      name: cardoria-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
