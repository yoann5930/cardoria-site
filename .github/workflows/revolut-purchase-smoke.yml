name: Revolut purchase smoke test

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/revolut-purchase-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revolut-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Record Revolut status without creating an order
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --fail --silent --show-error --retry 3 --retry-delay 3 https://www.cardoriashop.fr/api/payments/status)"
          PROVIDER="$(node -e 'const s=JSON.parse(process.argv[1]); process.stdout.write(String(s.provider||""))' "$STATUS")"
          ENVIRONMENT="$(node -e 'const s=JSON.parse(process.argv[1]); process.stdout.write(String(s.environment||""))' "$STATUS")"
          CONFIGURED="$(node -e 'const s=JSON.parse(process.argv[1]); process.stdout.write(String(Boolean(s.configured)))' "$STATUS")"
          if [ "$PROVIDER" != "revolut" ] || [ "$ENVIRONMENT" != "sandbox" ]; then
            echo "Unexpected payment status: $STATUS"
            exit 1
          fi

          PRODUCTS="$(curl --fail --silent --show-error --retry 3 --retry-delay 3 https://www.cardoriashop.fr/api/payments/boutique/products)"
          PRODUCT_ID="$(node -e 'const d=JSON.parse(process.argv[1]); const p=(d.products||[]).filter(x=>x.purchasable && Number(x.stock)>0 && Number(x.price)>0).sort((a,b)=>Number(a.price)-Number(b.price))[0]; if(!p) process.exit(2); process.stdout.write(String(p.id));' "$PRODUCTS")"
          PRODUCT_NAME="$(node -e 'const d=JSON.parse(process.argv[1]); const id=process.argv[2]; const p=(d.products||[]).find(x=>String(x.id)===id); process.stdout.write(String(p?.name||""));' "$PRODUCTS" "$PRODUCT_ID")"
          PRODUCT_PRICE="$(node -e 'const d=JSON.parse(process.argv[1]); const id=process.argv[2]; const p=(d.products||[]).find(x=>String(x.id)===id); process.stdout.write(String(Number(p?.price||0)));' "$PRODUCTS" "$PRODUCT_ID")"

          # Never create a Boutique order or Revolut checkout from this workflow.
          RESULT="$(node -e 'const product={id:process.argv[1],name:process.argv[2],price:Number(process.argv[3])}; const configured=process.argv[4]==="true"; process.stdout.write(JSON.stringify({testedAt:new Date().toISOString(),provider:"revolut",environment:"sandbox",configured,product,httpStatus:null,checkoutCreated:false,orderId:"",providerOrderId:"",error:configured?"Smoke lecture seule: aucun checkout réel n’est lancé.":"REVOLUT_SECRET_KEY manquante dans /etc/cardoria/cardoria.env sur OVH"},null,2));' "$PRODUCT_ID" "$PRODUCT_NAME" "$PRODUCT_PRICE" "$CONFIGURED")"

          printf '%s\n' "$RESULT" > .github/revolut-smoke-result.json
          cat .github/revolut-smoke-result.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/revolut-smoke-result.json
          git commit -m "test: record Revolut smoke result" || exit 0
          git push
