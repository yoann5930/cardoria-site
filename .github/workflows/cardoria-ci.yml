# Final stability validation trigger
name: Cardoria CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "script.js"
      - "admin-login.html"
      - "admin-email-login.html"
      - "admin.html"
      - "js/admin/**"
      - "render.yaml"
      - ".github/workflows/cardoria-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "script.js"
      - "admin-login.html"
      - "admin-email-login.html"
      - "admin.html"
      - "js/admin/**"
      - "render.yaml"
      - ".github/workflows/cardoria-ci.yml"

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: 10000
      ADMIN_EMAIL: Cardoria59330@gmail.com
      ADMIN_INITIAL_PASSWORD: Cardoria-CI-Temporary-Password-2026!
      LEGACY_ADMIN_CODE: "false"
      ADMIN_AUTH_DISABLED: "false"
      CORS_ORIGINS: http://127.0.0.1:10000
      ALERT_EMAIL: "false"
      CSRF_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"

      - name: Install backend dependencies
        run: npm install --omit=dev

      - name: Syntax checks
        run: |
          node --check server.js
          node --check routes/auth.js
          node --check lib/auth.js
          node --check lib/auth/migrate.js
          node --check lib/auth/magicLink.js
          node --check ../script.js
          node --check ../js/admin/admin-login-secure.js
          node --check ../js/admin/admin-email-login.js

      - name: Reject client-side admin bypass
        working-directory: .
        run: |
          if grep -R -n 'ADMIN_CODE_LOCAL="CARDORIA59330"\|const ADMIN_CODE_LOCAL="CARDORIA59330"' script.js js *.html 2>/dev/null; then
            echo "Client-side admin bypass detected"
            exit 1
          fi
          if grep -R -n 'ADMIN_AUTH_DISABLED.*true' backend render.yaml 2>/dev/null; then
            echo "Direct admin bypass must never be enabled"
            exit 1
          fi

      - name: Start backend
        run: |
          npm start > /tmp/cardoria-backend.log 2>&1 &
          echo $! > /tmp/cardoria-backend.pid

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/api/health/ > /tmp/cardoria-health.json; then
              cat /tmp/cardoria-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cardoria-backend.log || true
          exit 1

      - name: Verify admin login page
        run: |
          curl -fsS http://127.0.0.1:10000/admin-login.html > /tmp/cardoria-admin-login.html
          grep -q "Admin Cardoria" /tmp/cardoria-admin-login.html
          grep -q "adminEmailLoginForm" /tmp/cardoria-admin-login.html

      - name: Verify magic-link endpoint is public and neutral
        run: |
          code=$(curl -sS -o /tmp/cardoria-auth.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"email":"unknown-ci-user@cardoria.invalid"}' \
            http://127.0.0.1:10000/api/auth/email/request)
          cat /tmp/cardoria-auth.json
          test "$code" = "200"
          grep -q '"ok":true' /tmp/cardoria-auth.json

      - name: Verify protected admin endpoint rejects anonymous access
        run: |
          code=$(curl -sS -o /tmp/cardoria-protected.json -w "%{http_code}" \
            http://127.0.0.1:10000/api/health/full)
          cat /tmp/cardoria-protected.json
          test "$code" = "401"

      - name: Backend log on failure
        if: failure()
        run: cat /tmp/cardoria-backend.log || true

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/cardoria-backend.pid ]; then kill $(cat /tmp/cardoria-backend.pid) || true; fi
