services:
  - type: web
    name: cardoria-site-2
    runtime: node
    autoDeployTrigger: commit
    buildCommand: cd backend && npm install --omit=dev
    startCommand: cd backend && npm start
    healthCheckPath: /api/health/
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: LEGACY_ADMIN_CODE
        value: "false"
      - key: SITE_URL
        value: https://cardoria-site-2.onrender.com
      - key: CORS_ORIGINS
        value: https://cardoria-site-2.onrender.com,https://cardoria.fr,https://www.cardoria.fr,https://cardoria.vercel.app,https://cardoria-site-2tve.vercel.app
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: Cardoria59330@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: Cardoria <Cardoria59330@gmail.com>
      - key: MAIL_TO
        value: Cardoria59330@gmail.com
    disk:
      name: cardoria-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
