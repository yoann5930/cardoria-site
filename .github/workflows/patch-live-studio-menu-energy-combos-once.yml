name: Patch Live Studio Menu Energy Combos Once
on:
  push:
    branches: [fix/live-studio-menu-energy-combos-20260916]
    paths: ['.github/workflows/patch-live-studio-menu-energy-combos-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean menu and add energy item combinations
        shell: bash
        run: |
          set -euo pipefail
          cat > js/live-studio-sales-controls.js <<'EOF'
          (function(){
            "use strict";
            var ENERGY_SPOTS=["Plante","Feu","Eau","Électrique","Psy","Combat","Obscurité","Métal","Dragon","Incolore","Dresseur / Supporter","Objet / Stade"];
            function isAdmin(){return /admin-live\.html$/i.test(location.pathname);}
            function token(){return window.CardoriaMarketplace&&CardoriaMarketplace.getToken?CardoriaMarketplace.getToken():"";}
            function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}
            function post(path,body){if(isAdmin()&&window.CardoriaAdmin)return CardoriaAdmin.adminFetch(path,{method:"POST",body:JSON.stringify(body||{})});return fetch((window.CARDORIA_BACKEND||location.origin)+path,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token()},body:JSON.stringify(body||{})}).then(function(r){return r.json().then(function(d){if(!r.ok||d.ok===false)throw new Error(d.error||"Erreur Live");return d;});});}
            function get(path){if(isAdmin()&&window.CardoriaAdmin)return CardoriaAdmin.adminFetch(path);return fetch((window.CARDORIA_BACKEND||location.origin)+path,{headers:{Authorization:"Bearer "+token()},cache:"no-store"}).then(function(r){return r.json().then(function(d){if(!r.ok||d.ok===false)throw new Error(d.error||"Erreur Live");return d;});});}
            function liveId(){return String(window.CardoriaLiveSelectedId||"");}
            function productId(){var p=document.getElementById("lasProduct");return p&&p.value?String(p.value):"";}
            function actionPath(suffix){var id=liveId();if(!id)return"";return isAdmin()?"/api/admin/live/sessions/"+encodeURIComponent(id)+"/actions/"+suffix:"/api/live/actions/seller/"+encodeURIComponent(id)+"/"+suffix;}
            function statePath(){var id=liveId();return isAdmin()?"/api/admin/live/sessions/"+encodeURIComponent(id)+"/actions":"/api/live/actions/"+encodeURIComponent(id)+"/state";}
            function sessionPath(){var id=liveId();return isAdmin()?"/api/admin/live/sessions/"+encodeURIComponent(id):"/api/live/sessions/"+encodeURIComponent(id);}
            function sheet(title,html,onGo){var s=document.getElementById("lasSheet");if(!s)return alert("Panneau de vente indisponible.");s.hidden=false;document.getElementById("lasSheetTitle").textContent=title;document.getElementById("lasSheetFields").innerHTML=html;document.getElementById("lasSheetGo").onclick=onGo;document.getElementById("lasSheetCancel").onclick=function(){s.hidden=true;};}
            function requireContext(){var id=liveId(),pid=productId();if(!id){alert("Sélectionnez un Live.");return null;}if(!pid){alert("Ajoutez et sélectionnez d’abord un lot dans la file.");return null;}return{id:id,productId:pid};}
            function energyChecks(selected){selected=selected||[];return "<div class='live-energy-grid'>"+ENERGY_SPOTS.map(function(e){return "<label><input type='checkbox' data-energy='1' value='"+esc(e)+"'"+(selected.indexOf(e)>=0?" checked":"")+"> "+esc(e)+"</label>";}).join("")+"</div>";}
            function selectedEnergies(){return Array.prototype.map.call(document.querySelectorAll("[data-energy='1']:checked"),function(x){return x.value;});}
            function loadData(){var c=requireContext();if(!c)return Promise.reject(new Error("Contexte Live manquant."));return Promise.all([get(statePath()),get(sessionPath())]).then(function(r){return{state:r[0].state||r[0].actions||{},session:r[1].session||{}};});}
            function loadState(){return loadData().then(function(d){return d.state;});}
            function configureEnergyItem(){var c=requireContext();if(!c)return;loadState().then(function(state){var current=(state.energyTypesByProduct&&state.energyTypesByProduct[c.productId])||[];sheet("Énergies de l’item sélectionné","<p class='live-sheet-help'>Coche uniquement les énergies réellement présentes. Elles seront mémorisées pour cet item.</p>"+energyChecks(current),function(){var values=selectedEnergies();if(!values.length)return alert("Sélectionnez au moins une énergie.");post(actionPath("energy-config"),{productId:c.productId,energyTypes:values}).then(function(){document.getElementById("lasSheet").hidden=true;}).catch(function(e){alert(e.message);});});}).catch(function(e){alert(e.message);});}
            function startBreak(type,spots,price,labels,sourceIds){var c=requireContext();if(!c)return;post(actionPath("break/start"),{productId:c.productId,breakType:type,spots:spots,pricePerSpot:price,spotLabels:labels||[],energySourceProductIds:sourceIds||[]}).then(function(){var s=document.getElementById("lasSheet");if(s)s.hidden=true;setTimeout(function(){location.reload();},250);}).catch(function(e){alert(e.message);});}
            function compositionOptions(products,currentId){var list=[],i,j;products=(products||[]).filter(function(p){return p&&p.id;});for(i=0;i<products.length;i++)list.push({ids:[String(products[i].id)],label:String(products[i].name||products[i].id)});for(i=0;i<products.length;i++)for(j=i+1;j<products.length;j++)list.push({ids:[String(products[i].id),String(products[j].id)],label:String(products[i].name||products[i].id)+" + "+String(products[j].name||products[j].id)});list.sort(function(a,b){var ac=a.ids.indexOf(String(currentId))>=0?0:1,bc=b.ids.indexOf(String(currentId))>=0?0:1;return ac-bc||a.ids.length-b.ids.length||a.label.localeCompare(b.label,"fr");});return list;}
            function energyUnion(state,ids){var map=state.energyTypesByProduct||{},out=[],missing=[];ids.forEach(function(id){var values=Array.isArray(map[id])?map[id]:[];if(!values.length)missing.push(id);values.forEach(function(e){if(ENERGY_SPOTS.indexOf(e)>=0&&out.indexOf(e)<0)out.push(e);});});return{energies:out,missing:missing};}
            function startEnergyGame(){var c=requireContext();if(!c)return;loadData().then(function(data){var products=data.session.products||[],choices=compositionOptions(products,c.productId);if(!choices.length)return alert("Aucun item disponible dans ce Live.");var currentChoice=choices.filter(function(x){return x.ids.length===1&&x.ids[0]===c.productId;})[0]||choices[0];var options=choices.map(function(x){return "<option value='"+esc(x.ids.join("||"))+"'"+(x===currentChoice?" selected":"")+">"+esc(x.label)+"</option>";}).join("");sheet("Jeu de l’énergie","<label class='live-field'><span>Composition du jeu</span><select id='lasEnergyComposition'>"+options+"</select></label><div id='lasEnergyPreview' class='live-energy-preview'></div><label class='live-field'><span>Prix / spot</span><input id='lasEnergyPrice' type='number' min='0.01' step='0.01' value='1'></label>",function(){var ids=String(document.getElementById("lasEnergyComposition").value||"").split("||").filter(Boolean),info=energyUnion(data.state,ids);if(info.missing.length)return alert("Configure d’abord les énergies de tous les items choisis avec le bouton Énergies item.");if(!info.energies.length)return alert("Aucune énergie configurée pour cette composition.");startBreak("energy_game",info.energies.length,Number(document.getElementById("lasEnergyPrice").value||0),info.energies,ids);});var select=document.getElementById("lasEnergyComposition"),preview=document.getElementById("lasEnergyPreview");function refresh(){var ids=String(select.value||"").split("||").filter(Boolean),info=energyUnion(data.state,ids),names=ids.map(function(id){var p=products.filter(function(x){return String(x.id)===id;})[0];return p?String(p.name||id):id;});preview.innerHTML=info.missing.length?"<strong>Configuration manquante.</strong> Ouvre Énergies item pour chaque item choisi.":"<strong>"+esc(names.join(" + "))+"</strong><br>Spots automatiques : "+info.energies.map(esc).join(" · ")+"<br><strong>"+info.energies.length+" spot(s)</strong>";}select.onchange=refresh;refresh();}).catch(function(e){alert(e.message);});}
            function ensureGroup(actions,id,title){var g=document.getElementById(id);if(g)return g;g=document.createElement("div");g.id=id;g.className="live-action-group";g.innerHTML="<div class='live-action-group-title'>"+title+"</div><div class='live-action-group-buttons'></div>";actions.appendChild(g);return g;}
            function moveInto(group,ids){var holder=group.querySelector(".live-action-group-buttons");ids.forEach(function(id){var el=document.getElementById(id);if(el&&el.parentNode!==holder)holder.appendChild(el);});}
            function organize(actions){if(actions.dataset.organized==="1"&&document.getElementById("lasGroupSales"))return;actions.dataset.organized="1";var sales=ensureGroup(actions,"lasGroupSales","Vendre"),games=ensureGroup(actions,"lasGroupGames","Jeux / breaks"),promo=ensureGroup(actions,"lasGroupPromo","Animation");moveInto(sales,["lasBuyNow","lasAuction","lasFlash"]);moveInto(games,["lasBreak","lasBoxBreak","lasGame","lasEnergyConfig"]);moveInto(promo,["lasGiveaway"]);}
            function decorate(){var actions=document.querySelector(".live-studio-actions");if(!actions)return;var game=document.getElementById("lasGame");if(game&&game.dataset.salesEnhanced!=="1"){game.dataset.salesEnhanced="1";game.disabled=false;game.textContent="Jeu de l’énergie";game.title="Choisir 1 item ou 2 items différents, puis générer automatiquement les énergies présentes";game.onclick=startEnergyGame;}if(!document.getElementById("lasEnergyConfig")){var cfg=document.createElement("button");cfg.type="button";cfg.id="lasEnergyConfig";cfg.textContent="Énergies item";cfg.title="Définir les énergies présentes dans l’item sélectionné";actions.appendChild(cfg);cfg.onclick=configureEnergyItem;}if(!document.getElementById("lasBoxBreak")){var btn=document.createElement("button");btn.type="button";btn.id="lasBoxBreak";btn.textContent="Box Break";actions.appendChild(btn);btn.onclick=function(){var c=requireContext();if(!c)return;sheet("Box Break","<label class='live-field'><span>Nombre de spots</span><input id='lasBoxSpots' type='number' min='1' max='1000' value='12'></label><label class='live-field'><span>Prix / spot</span><input id='lasBoxPrice' type='number' min='0.01' step='0.01' value='1'></label>",function(){startBreak("box_break",Number(document.getElementById("lasBoxSpots").value||0),Number(document.getElementById("lasBoxPrice").value||0),[],[]);});};}var follow=document.getElementById("lasGiveFollow"),buyer=document.getElementById("lasGiveBuyer");if(follow){follow.hidden=true;follow.style.display="none";follow.setAttribute("aria-hidden","true");}if(buyer){buyer.hidden=true;buyer.style.display="none";buyer.setAttribute("aria-hidden","true");}organize(actions);}
            var decorateTimer=setInterval(decorate,1000);window.addEventListener("cardoria-live-selected",function(){setTimeout(decorate,0);});document.addEventListener("DOMContentLoaded",decorate);decorate();window.addEventListener("beforeunload",function(){clearInterval(decorateTimer);});window.CardoriaLiveSalesControls={energySpots:ENERGY_SPOTS.slice(),decorate:decorate,compositionOptions:compositionOptions,energyUnion:energyUnion};
          })();
          EOF
          cp js/live-studio-sales-controls.js backend/public/js/live-studio-sales-controls.js

          mkdir -p css backend/public/css
          cat > css/live-studio-clean.css <<'EOF'
          #lasGiveFollow,#lasGiveBuyer{display:none!important}
          .live-studio-current,.live-studio-queue{min-width:0}
          .live-studio-quick{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px!important;margin:10px 0 12px}
          .live-studio-quick button{min-height:42px;width:100%;padding:8px 10px}
          .live-studio-actions{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px!important;align-items:start}
          .live-action-group{border:1px solid rgba(211,169,44,.32);border-radius:12px;background:rgba(10,12,16,.72);padding:10px;min-width:0}
          .live-action-group-title{font-size:12px;font-weight:800;color:#e4c866;text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px}
          .live-action-group-buttons{display:grid;grid-template-columns:1fr;gap:7px}
          .live-action-group-buttons button{width:100%;min-height:44px;margin:0!important;padding:8px 10px}
          .live-studio-sheet{border-radius:12px!important}
          #lasSheet:not([hidden]){display:grid!important;gap:10px;margin-top:12px;padding:12px;background:#101217;border:1px solid rgba(211,169,44,.38)}
          #lasSheetFields{display:grid;gap:10px}
          .live-field{display:grid;gap:5px;font-weight:700}
          .live-field span{font-size:12px;color:#d7c477}
          .live-field select,.live-field input,#lasSheetFields select,#lasSheetFields input{width:100%;min-height:42px;border-radius:9px;padding:8px 10px}
          .live-energy-preview{padding:10px;border-radius:9px;background:#0a0c10;border:1px solid rgba(211,169,44,.24);line-height:1.55}
          .live-sheet-help{margin:0;color:#d0d3d8;line-height:1.45}
          .live-energy-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
          .live-energy-grid label{display:flex;gap:7px;align-items:center;padding:7px;border-radius:8px;background:#0b0d11}
          .live-energy-grid input{width:auto!important;min-height:auto!important}
          .live-studio-file{max-height:330px;overflow:auto;padding-right:3px}
          @media(max-width:1100px){.live-studio-actions{grid-template-columns:1fr 1fr}.live-action-group:last-child{grid-column:1/-1}.live-studio-quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
          @media(max-width:720px){.live-studio-actions,.live-studio-quick,.live-energy-grid{grid-template-columns:1fr!important}.live-action-group:last-child{grid-column:auto}}
          EOF
          cp css/live-studio-clean.css backend/public/css/live-studio-clean.css

          python - <<'PY'
          from pathlib import Path

          # Backend: energy game can use one item or the union of two different item configurations.
          p=Path('backend/lib/live/actions.js')
          s=p.read_text()
          old='export function startBreak(liveId,{productId,spots=1,pricePerSpot,breakType="break",spotLabels}={}){const live=requireLive(liveId),product=productFor(live,productId),type=["break","box_break","energy_game"].includes(String(breakType||"").toLowerCase())?String(breakType).toLowerCase():"break",{d,state}=stateFor(live.id,true);const configured=normalizeEnergyTypes(state.energyTypesByProduct?.[product.id]);const labels=type==="energy_game"?configured:(Array.isArray(spotLabels)?spotLabels.map((x)=>clean(x,80)).filter(Boolean).slice(0,1000):[]);if(type==="energy_game"&&!labels.length)throw Object.assign(new Error("Aucune énergie n\'est configurée pour cet item. Renseignez les énergies présentes dans l\'item avant de lancer le jeu."),{status:409});const requested=type==="energy_game"?labels.length:spots,count=Math.max(1,Math.min(1000,Math.trunc(Number(requested)||product.qty||1))),price=money(pricePerSpot||product.price);if(price<=0)throw Object.assign(new Error("Prix du spot invalide."),{status:400});if(labels.length&&labels.length!==count)throw Object.assign(new Error("Le nombre de noms de spots doit correspondre au nombre de spots."),{status:400});if(Number(product.stock||0)<count)throw Object.assign(new Error(`Stock insuffisant : ${count} spots sont nécessaires pour ce ${type==="energy_game"?"jeu de l’énergie":"break"}.`),{status:409});state.pinnedProductId=product.id;state.break={id:"BRK-"+crypto.randomUUID(),productId:product.id,productName:product.name,status:"running",breakType:type,label:type==="box_break"?"Box Break":type==="energy_game"?"Jeu de l’énergie":"Break",spots:count,spotLabels:labels,pricePerSpot:price,stockAtStart:Number(product.stock||0),soldSpots:0,remainingSpots:count,startedAt:nowIso()};state.updatedAt=nowIso();save(d);return structuredClone(state.break);}'
          new='export function startBreak(liveId,{productId,spots=1,pricePerSpot,breakType="break",spotLabels,energySourceProductIds}={}){const live=requireLive(liveId),product=productFor(live,productId),type=["break","box_break","energy_game"].includes(String(breakType||"").toLowerCase())?String(breakType).toLowerCase():"break",{d,state}=stateFor(live.id,true);let sourceIds=[product.id];if(type==="energy_game"&&Array.isArray(energySourceProductIds)&&energySourceProductIds.length){sourceIds=[...new Set(energySourceProductIds.map((x)=>clean(x,120)).filter(Boolean))].slice(0,2);if(sourceIds.length>1&&sourceIds[0]===sourceIds[1])sourceIds=sourceIds.slice(0,1);sourceIds.forEach((id)=>productFor(live,id));}let configured=[];if(type==="energy_game"){for(const id of sourceIds){const values=normalizeEnergyTypes(state.energyTypesByProduct?.[id]);if(!values.length)throw Object.assign(new Error("Toutes les énergies des items sélectionnés doivent être configurées avant de lancer le jeu."),{status:409,productId:id});for(const value of values)if(!configured.includes(value))configured.push(value);}}else configured=normalizeEnergyTypes(state.energyTypesByProduct?.[product.id]);const labels=type==="energy_game"?configured:(Array.isArray(spotLabels)?spotLabels.map((x)=>clean(x,80)).filter(Boolean).slice(0,1000):[]);if(type==="energy_game"&&!labels.length)throw Object.assign(new Error("Aucune énergie n\'est configurée pour cette composition."),{status:409});const requested=type==="energy_game"?labels.length:spots,count=Math.max(1,Math.min(1000,Math.trunc(Number(requested)||product.qty||1))),price=money(pricePerSpot||product.price);if(price<=0)throw Object.assign(new Error("Prix du spot invalide."),{status:400});if(labels.length&&labels.length!==count)throw Object.assign(new Error("Le nombre de noms de spots doit correspondre au nombre de spots."),{status:400});if(type!=="energy_game"&&Number(product.stock||0)<count)throw Object.assign(new Error(`Stock insuffisant : ${count} spots sont nécessaires pour ce break.`),{status:409});if(type==="energy_game"&&Number(product.stock||0)<1)throw Object.assign(new Error("Stock insuffisant pour lancer ce jeu de l’énergie."),{status:409});const sourceNames=sourceIds.map((id)=>productFor(live,id).name);state.pinnedProductId=product.id;state.break={id:"BRK-"+crypto.randomUUID(),productId:product.id,productName:product.name,status:"running",breakType:type,label:type==="box_break"?"Box Break":type==="energy_game"?"Jeu de l’énergie":"Break",spots:count,spotLabels:labels,energySourceProductIds:type==="energy_game"?sourceIds:[],energySourceNames:type==="energy_game"?sourceNames:[],pricePerSpot:price,stockAtStart:Number(product.stock||0),soldSpots:0,remainingSpots:count,startedAt:nowIso()};state.updatedAt=nowIso();save(d);return structuredClone(state.break);}'
          if old not in s:
              raise SystemExit('startBreak target not found')
          p.write_text(s.replace(old,new,1))

          # Load dedicated cleanup stylesheet in both runtime copies of admin-live.
          for file in ['admin-live.html','backend/public/admin-live.html']:
              p=Path(file); s=p.read_text()
              marker='<link rel="stylesheet" href="/css/admin.css?v=20260912-studio-pr1">'
              link='<link rel="stylesheet" href="/css/live-studio-clean.css?v=20260916-menu-clean-v1">'
              if link not in s:
                  if marker not in s: raise SystemExit(f'{file}: css marker missing')
                  s=s.replace(marker,marker+'\n'+link,1)
              s=s.replace('/js/live-studio-sales-controls.js?v=20260916-sales-controls-v3','/js/live-studio-sales-controls.js?v=20260916-energy-combos-v1')
              p.write_text(s)
          PY

          cat > tests/live-energy-combinations.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { __setLiveActionsStoreForTests, __resetLiveActionsStoreForTests, setLiveProductEnergyTypes, startBreak } from "../backend/lib/live/actions.js";
          import { __setLiveSessionsStoreForTests, __resetLiveSessionsStoreForTests } from "../backend/lib/live/sessions.js";

          test("energy game unions configured energies from two different items",()=>{
            const live={id:"LIVE-COMBO",title:"Combo",ownerRole:"admin",ownerId:"admin",status:"live",products:[{id:"A",name:"Item A",qty:1,stock:1,price:2,mode:"break"},{id:"B",name:"Item B",qty:1,stock:1,price:2,mode:"break"}]};
            __setLiveSessionsStoreForTests({sessions:[live],checkouts:[]});
            __setLiveActionsStoreForTests({states:{}});
            setLiveProductEnergyTypes(live.id,"A",["Feu","Eau"]);
            setLiveProductEnergyTypes(live.id,"B",["Eau","Psy"]);
            const game=startBreak(live.id,{productId:"A",breakType:"energy_game",pricePerSpot:3,energySourceProductIds:["A","B"]});
            assert.deepEqual(game.spotLabels,["Feu","Eau","Psy"]);
            assert.deepEqual(game.energySourceProductIds,["A","B"]);
            assert.deepEqual(game.energySourceNames,["Item A","Item B"]);
            assert.equal(game.spots,3);
            __resetLiveActionsStoreForTests();__resetLiveSessionsStoreForTests();
          });
          EOF

          node --check js/live-studio-sales-controls.js
          node --check backend/lib/live/actions.js
          node --test tests/live-energy-combinations.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/live-studio-sales-controls.js backend/public/js/live-studio-sales-controls.js css/live-studio-clean.css backend/public/css/live-studio-clean.css backend/lib/live/actions.js admin-live.html backend/public/admin-live.html tests/live-energy-combinations.test.mjs
          git commit -m 'feat(live): clean studio menu and add energy item combinations'
          git push origin HEAD:fix/live-studio-menu-energy-combos-20260916
