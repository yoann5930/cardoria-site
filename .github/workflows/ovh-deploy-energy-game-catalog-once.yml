name: OVH Deploy Energy Game Catalog Once
on:
  push:
    branches: [ops/deploy-energy-game-catalog-20260916]
permissions:
  contents: read
jobs:
  deploy:
    uses: ./.github/workflows/ovh-ops-run.yml
    with:
      action: deploy
      branch: main
    secrets: inherit
  healthcheck:
    needs: deploy
    uses: ./.github/workflows/ovh-ops-run.yml
    with:
      action: healthcheck
      branch: main
    secrets: inherit
  report:
    needs: healthcheck
    uses: ./.github/workflows/ovh-ops-run.yml
    with:
      action: report
      branch: main
    secrets: inherit
