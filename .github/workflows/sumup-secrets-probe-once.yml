name: SumUp Secrets Probe Once

on:
  push:
    branches:
      - ops/probe-sumup-secrets-20260916

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check SumUp secret presence only
        env:
          SUMUP_API_KEY: ${{ secrets.OVH_SUMUP_API_KEY }}
          SUMUP_MERCHANT_CODE: ${{ secrets.OVH_SUMUP_MERCHANT_CODE }}
          SUMUP_WEBHOOK_SECRET: ${{ secrets.OVH_SUMUP_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          if [ -n "${SUMUP_API_KEY:-}" ]; then echo "OVH_SUMUP_API_KEY: present"; else echo "OVH_SUMUP_API_KEY: missing"; missing=1; fi
          if [ -n "${SUMUP_MERCHANT_CODE:-}" ]; then echo "OVH_SUMUP_MERCHANT_CODE: present"; else echo "OVH_SUMUP_MERCHANT_CODE: missing"; missing=1; fi
          if [ -n "${SUMUP_WEBHOOK_SECRET:-}" ]; then echo "OVH_SUMUP_WEBHOOK_SECRET: present"; else echo "OVH_SUMUP_WEBHOOK_SECRET: missing"; missing=1; fi
          exit "$missing"
