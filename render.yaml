# Cardoria production deployment
services:
  - type: web
    name: cardoria-site-2
    runtime: node
    autoDeployTrigger: commit
    buildCommand: cd backend && npm install --omit=dev
    startCommand: cd backend && npm start
    healthCheckPath: /api/health/
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: LEGACY_ADMIN_CODE
        value: "false"
      - key: ADMIN_AUTH_DISABLED
        value: "false"
      - key: SITE_URL
        value: https://cardoria-site-2.onrender.com
      - key: FRONTEND_URL
        value: https://cardoria-site-2.onrender.com
      - key: CORS_ORIGINS
        value: https://cardoria-site-2.onrender.com,https://cardoria.fr,https://www.cardoria.fr
      - key: MARKETPLACE_DEMO_MODE
        value: "false"
      - key: MARKETPLACE_COMMISSION_PERCENT
        value: "5"
      - key: MARKETPLACE_COMMISSION_INCLUDE_SHIPPING
        value: "false"
      # PAYPAL_ENV reste sandbox tant que des identifiants Live verifies ne sont pas installes.
      # Le passage Live doit etre atomique avec PAYPAL_CLIENT_ID/SECRET/partner Live.
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_DISBURSEMENT_MODE
        value: INSTANT
      - key: MARKETPLACE_DATABASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_PARTNER_MERCHANT_ID
        sync: false
      - key: PAYPAL_PARTNER_ATTRIBUTION_ID
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: SUMUP_API_KEY
        sync: false
      - key: SUMUP_MERCHANT_CODE
        sync: false
      - key: SUMUP_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: cardoria59330@gmail.com
      - key: MAIL_FROM
        value: cardoria59330@gmail.com
      - key: MAIL_TO
        value: cardoria59330@gmail.com
      - key: SMTP_PASS
        sync: false
