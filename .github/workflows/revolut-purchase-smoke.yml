name: Revolut purchase smoke test

on:
  push:
    paths:
      - '.github/workflows/revolut-purchase-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revolut-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run Revolut Sandbox purchase smoke test
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --fail --silent --show-error --retry 3 --retry-delay 3 https://www.cardoriashop.fr/api/payments/status)"
          PROVIDER="$(node -e 'const s=JSON.parse(process.argv[1]); process.stdout.write(String(s.provider||""))' "$STATUS")"
          ENVIRONMENT="$(node -e 'const s=JSON.parse(process.argv[1]); process.stdout.write(String(s.environment||""))' "$STATUS")"
          CONFIGURED="$(node -e 'const s=JSON.parse(process.argv[1]); process.stdout.write(String(Boolean(s.configured)))' "$STATUS")"
          if [ "$PROVIDER" != "revolut" ] || [ "$ENVIRONMENT" != "sandbox" ]; then
            echo "Unexpected payment status: $STATUS"
            exit 1
          fi

          PRODUCTS="$(curl --fail --silent --show-error --retry 3 --retry-delay 3 https://www.cardoriashop.fr/api/payments/boutique/products)"
          PRODUCT_ID="$(node -e 'const d=JSON.parse(process.argv[1]); const p=(d.products||[]).filter(x=>x.purchasable && Number(x.stock)>0 && Number(x.price)>0).sort((a,b)=>Number(a.price)-Number(b.price))[0]; if(!p) process.exit(2); process.stdout.write(String(p.id));' "$PRODUCTS")"
          PRODUCT_NAME="$(node -e 'const d=JSON.parse(process.argv[1]); const id=process.argv[2]; const p=(d.products||[]).find(x=>String(x.id)===id); process.stdout.write(String(p?.name||""));' "$PRODUCTS" "$PRODUCT_ID")"
          PRODUCT_PRICE="$(node -e 'const d=JSON.parse(process.argv[1]); const id=process.argv[2]; const p=(d.products||[]).find(x=>String(x.id)===id); process.stdout.write(String(Number(p?.price||0)));' "$PRODUCTS" "$PRODUCT_ID")"

          if [ "$CONFIGURED" = "true" ]; then
            export PRODUCT_ID
            PAYLOAD="$(node -e 'process.stdout.write(JSON.stringify({customerName:"Test CardoriaShop",customerEmail:"checkout-test@cardoriashop.fr",customerPhone:"+33600000000",address:"1 rue du Test",postalCode:"75001",city:"Paris",country:"France",items:[{ref:process.env.PRODUCT_ID,qty:1}],shipping:"Standard",successUrl:"https://www.cardoriashop.fr/boutique.html?gamme=pokemon"}))')"
            TMP="$(mktemp)"
            HTTP_CODE="$(curl --silent --show-error --output "$TMP" --write-out '%{http_code}' --request POST https://www.cardoriashop.fr/api/payments/boutique/checkout --header 'Content-Type: application/json' --data "$PAYLOAD")"
            CHECKOUT="$(cat "$TMP")"
            rm -f "$TMP"
            RESULT="$(node -e 'const d=JSON.parse(process.argv[1]); const code=Number(process.argv[2]); const product={id:process.argv[3],name:process.argv[4],price:Number(process.argv[5])}; process.stdout.write(JSON.stringify({testedAt:new Date().toISOString(),provider:"revolut",environment:"sandbox",configured:true,product,httpStatus:code,checkoutCreated:Boolean(code===200&&d.ok&&d.url),orderId:d.orderId||"",providerOrderId:d.checkoutId||d.providerOrderId||"",error:d.error||""},null,2));' "$CHECKOUT" "$HTTP_CODE" "$PRODUCT_ID" "$PRODUCT_NAME" "$PRODUCT_PRICE")"
          else
            RESULT="$(node -e 'const product={id:process.argv[1],name:process.argv[2],price:Number(process.argv[3])}; process.stdout.write(JSON.stringify({testedAt:new Date().toISOString(),provider:"revolut",environment:"sandbox",configured:false,product,httpStatus:null,checkoutCreated:false,orderId:"",providerOrderId:"",error:"REVOLUT_SECRET_KEY manquante sur Render"},null,2));' "$PRODUCT_ID" "$PRODUCT_NAME" "$PRODUCT_PRICE")"
          fi

          printf '%s\n' "$RESULT" > .github/revolut-smoke-result.json
          cat .github/revolut-smoke-result.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/revolut-smoke-result.json
          git commit -m "test: record Revolut smoke result" || exit 0
          git push
