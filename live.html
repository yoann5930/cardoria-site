<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Cardoria</title>
  <meta name="description" content="Retrouvez les lives Cardoria et les prochaines sessions en direct.">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#020508">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/css/cardoria-brand-polish.css?v=20260831-1">
  <link rel="icon" href="/assets/logo/cardoria-premium.png" type="image/png">
  <style>
    body{margin:0;background:#020508;color:#fff;font-family:Arial,Helvetica,sans-serif}
    .live-page{min-height:100vh;display:grid;place-items:center;padding:40px 20px;box-sizing:border-box;background:radial-gradient(circle at 50% 20%,rgba(214,174,67,.10),transparent 34%),#020508}
    .live-card{width:min(920px,100%);padding:54px 42px;border:1px solid rgba(214,174,67,.38);border-radius:22px;background:#050a0f;box-shadow:0 24px 80px rgba(0,0,0,.45);text-align:center}
    .live-badge{display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border:1px solid rgba(255,68,68,.75);border-radius:999px;background:rgba(180,18,18,.18);color:#ff5757;font-weight:800;letter-spacing:.12em}
    .live-dot{width:10px;height:10px;border-radius:50%;background:#ff3131;box-shadow:0 0 16px rgba(255,49,49,.9)}
    h1{margin:22px 0 10px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,6vw,68px);color:#e6c25a}
    p{margin:0 auto;color:#bbb;max-width:640px;font-size:18px;line-height:1.6}
    .live-state{margin:34px auto 0;padding:24px;border:1px solid rgba(214,174,67,.18);border-radius:16px;background:#03070b;color:#ddd}
    .live-actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:30px}
    .live-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:10px;text-decoration:none;font-weight:800}
    .primary{background:#d7b84f;color:#05070a}.secondary{border:1px solid rgba(214,174,67,.55);color:#e6c25a;background:transparent}
  </style>
</head>
<body>
  <main class="live-page">
    <section class="live-card" aria-labelledby="liveTitle">
      <span class="live-badge"><span class="live-dot" aria-hidden="true"></span> LIVE</span>
      <h1 id="liveTitle">Lives Cardoria</h1>
      <p>Retrouvez ici les ventes en direct, ouvertures et événements live de Cardoria.</p>
      <div class="live-state" role="status">Aucun live public n’est actuellement annoncé.</div>
      <div class="live-actions">
        <a class="primary" href="/marketplace.html">Voir la Marketplace</a>
        <a class="secondary" href="/">Retour à l’accueil</a>
      </div>
    </section>
  </main>
</body>
</html>
