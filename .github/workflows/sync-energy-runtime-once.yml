name: Sync Energy Runtime Once
on:
  push:
    branches: [fix/energy-game-config-no-lot-20260916]
    paths: ['.github/workflows/sync-energy-runtime-once.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          cp js/live-studio-sales-controls.js backend/public/js/live-studio-sales-controls.js
          node --check js/live-studio-sales-controls.js
          node --check backend/lib/live/energy-catalog.js
          node --check backend/lib/live/actions.js
          node --check backend/lib/live/checkout.js
          node --check backend/routes/live-actions.js
          node --check backend/routes/live-admin-studio.js
          node --test tests/live-sales-controls-regression.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/public/js/live-studio-sales-controls.js
          git commit -m 'chore(live): sync energy game runtime mirror' || true
          git push origin HEAD:fix/energy-game-config-no-lot-20260916
