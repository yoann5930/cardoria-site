name: Cardoria Energy Spot Payment CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  energy-spot-payment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend production dependencies
        working-directory: backend
        run: npm install --omit=dev
      - name: Energy spot payment end-to-end test
        run: node --test tests/energy-spot-payment.test.mjs
      - name: Production route smoke
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 https://www.cardoriashop.fr/api/live/matrix)
          echo "/api/live/matrix => $code"
          case "$code" in 200|204) ;; *) exit 1 ;; esac
