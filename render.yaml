# Cardoria production deployment
services:
  - type: web
    name: cardoria-site-2
    runtime: node
    autoDeployTrigger: commit
    buildCommand: cd backend && npm install --omit=dev
    startCommand: cd backend && npm start
    healthCheckPath: /api/health/
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: LEGACY_ADMIN_CODE
        value: "false"
      - key: ADMIN_AUTH_DISABLED
        value: "false"
      - key: SITE_URL
        value: https://cardoria-site-2.onrender.com
      - key: CORS_ORIGINS
        value: https://cardoria-site-2.onrender.com,https://cardoria.fr,https://www.cardoria.fr
      - key: MARKETPLACE_COMMISSION_PERCENT
        value: "5"
    disk:
      name: cardoria-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
