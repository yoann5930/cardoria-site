<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réinitialiser mon mot de passe — CardoriaShop</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#030303">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/css/client-auth.css?v=20260908-3">
  <link rel="icon" href="/assets/logo/cardoria-premium.png">
</head>
<body class="client-auth-page">
  <header class="client-auth-header">
    <a class="client-auth-brand" href="/" aria-label="Accueil CardoriaShop">
      <img src="/assets/logo/cardoria-premium.png" alt="CardoriaShop" onerror="this.onerror=null;this.src='/logo-cardoria.jpg'">
      <span><strong>CARDORIA</strong><small>ESPACE CLIENT</small></span>
    </a>
    <a class="client-auth-back" href="/client-login.html">Retour à la connexion</a>
  </header>
  <main class="client-auth-main">
    <section class="client-auth-shell">
      <div class="client-auth-intro">
        <p class="client-auth-kicker">SÉCURITÉ</p>
        <h1>Mot de passe oublié</h1>
        <p>Utilisez l’adresse e-mail de votre compte client. Un lien sécurisé vous sera envoyé si le compte existe.</p>
      </div>
      <div class="client-auth-card">
        <form id="clientResetRequestForm" class="client-auth-form">
          <label>Email
            <input id="clientResetEmail" type="email" autocomplete="email" required placeholder="vous@exemple.fr">
          </label>
          <button class="client-auth-primary" type="submit" id="clientResetRequestButton">Envoyer le lien</button>
        </form>
        <form id="clientResetConfirmForm" class="client-auth-form" hidden>
          <label>Nouveau mot de passe
            <input id="clientResetPassword" type="password" minlength="10" maxlength="128" autocomplete="new-password" required placeholder="10 caractères minimum">
          </label>
          <label>Confirmer le mot de passe
            <input id="clientResetPasswordConfirm" type="password" minlength="10" maxlength="128" autocomplete="new-password" required>
          </label>
          <p class="client-auth-help">Le mot de passe doit contenir au moins 10 caractères, avec des lettres et des chiffres.</p>
          <button class="client-auth-primary" type="submit" id="clientResetConfirmButton">Enregistrer le mot de passe</button>
        </form>
        <p id="clientResetMessage" class="client-auth-message" aria-live="polite"></p>
      </div>
    </section>
  </main>
  <script src="/js/client-password-reset.js?v=20260908-3"></script>
</body>
</html>
