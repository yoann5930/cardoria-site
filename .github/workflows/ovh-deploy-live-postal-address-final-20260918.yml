name: OVH Deploy Live Postal Address Final 20260918

on:
  push:
    branches:
      - ops/deploy-live-postal-address-final-20260918

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/ovh-ops-run.yml
    with:
      action: deploy
      branch: main
    secrets: inherit
  healthcheck:
    needs: deploy
    uses: ./.github/workflows/ovh-ops-run.yml
    with:
      action: healthcheck
      branch: main
    secrets: inherit
  report:
    needs: healthcheck
    uses: ./.github/workflows/ovh-ops-run.yml
    with:
      action: report
      branch: main
    secrets: inherit
