name: Cardoria Client Auth CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client-auth-e2e:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: '10000'
      ADMIN_INITIAL_PASSWORD: 'Cardoria-CI-Only-Password-2026!'
      ADMIN_EMAIL: 'ci-admin@cardoria.invalid'
      CORS_ORIGINS: 'http://127.0.0.1:10000'
      ALERT_EMAIL: 'false'
      MARKETPLACE_DEMO_MODE: 'false'
      LEGACY_ADMIN_CODE: 'false'
      ADMIN_AUTH_DISABLED: 'false'
      BACKUP_INTERVAL_HOURS: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - name: Install backend
        working-directory: backend
        run: npm install --omit=dev
      - name: Client auth frontend contract
        run: |
          node --check js/client-auth.js
          node --check js/client-password-reset.js
          grep -q '/api/auth/login' js/client-auth.js
          grep -q '/api/auth/register' js/client-auth.js
          grep -q '/api/auth/me' js/client-auth.js
          grep -q '/api/auth/logout' js/client-auth.js
          grep -q '/api/auth/password/request' js/client-password-reset.js
          grep -q '/api/auth/password/confirm' js/client-password-reset.js
          grep -q '/reset-password.html' client-login.html
      - name: Start backend
        working-directory: backend
        run: |
          node server.js > /tmp/cardoria-client-auth.log 2>&1 &
          echo $! > /tmp/cardoria-client-auth.pid
      - name: Wait for backend
        run: |
          ready=false
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:10000/api/health/startup > /tmp/startup.json && grep -q '"ready":true' /tmp/startup.json; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = "true"
      - name: Client register login session logout flow
        run: |
          EMAIL="client-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@cardoria.invalid"
          PASSWORD='ClientTest2026!'

          code=$(curl -sS -o /tmp/register.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"Client CI\",\"email\":\"${EMAIL}\",\"password\":\"${PASSWORD}\"}" \
            http://127.0.0.1:10000/api/auth/register)
          test "$code" = "201"
          grep -q '"ok":true' /tmp/register.json
          grep -q '"role":"client"' /tmp/register.json
          TOKEN=$(node -e "const d=require('fs').readFileSync('/tmp/register.json','utf8');process.stdout.write(JSON.parse(d).token||'')")
          test -n "$TOKEN"

          code=$(curl -sS -o /tmp/me.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            http://127.0.0.1:10000/api/auth/me)
          test "$code" = "200"
          grep -q '"role":"client"' /tmp/me.json
          grep -q "${EMAIL}" /tmp/me.json

          code=$(curl -sS -o /tmp/logout.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${TOKEN}" \
            -d '{}' \
            http://127.0.0.1:10000/api/auth/logout)
          test "$code" = "200"
          grep -q '"ok":true' /tmp/logout.json

          code=$(curl -sS -o /tmp/me-after-logout.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            http://127.0.0.1:10000/api/auth/me)
          test "$code" = "401"

          code=$(curl -sS -o /tmp/login.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"${EMAIL}\",\"password\":\"${PASSWORD}\"}" \
            http://127.0.0.1:10000/api/auth/login)
          test "$code" = "200"
          grep -q '"ok":true' /tmp/login.json
          grep -q '"role":"client"' /tmp/login.json
          LOGIN_TOKEN=$(node -e "const d=require('fs').readFileSync('/tmp/login.json','utf8');process.stdout.write(JSON.parse(d).token||'')")
          test -n "$LOGIN_TOKEN"

          code=$(curl -sS -o /tmp/bad-login.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"${EMAIL}\",\"password\":\"WrongPassword2026!\"}" \
            http://127.0.0.1:10000/api/auth/login)
          test "$code" = "401"
          grep -q 'Email ou mot de passe incorrect' /tmp/bad-login.json
      - name: Client password reset contract
        run: |
          code=$(curl -sS -o /tmp/reset-unknown.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"email":"unknown-client-ci@cardoria.invalid"}' \
            http://127.0.0.1:10000/api/auth/password/request)
          test "$code" = "200"
          grep -q '"ok":true' /tmp/reset-unknown.json
          grep -q 'Si le compte existe' /tmp/reset-unknown.json

          code=$(curl -sS -o /tmp/reset-invalid.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"token":"invalid-token","password":"NewClient2026!"}' \
            http://127.0.0.1:10000/api/auth/password/confirm)
          test "$code" = "400"
      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/cardoria-client-auth.pid ]; then kill $(cat /tmp/cardoria-client-auth.pid) || true; fi
          if [ -f /tmp/cardoria-client-auth.log ]; then cat /tmp/cardoria-client-auth.log; fi
